name: Get Marketplace identity ID

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  get-identity:
    name: Get managed identity Marketplace ID
    runs-on: ubuntu-latest
    environment: marketplace

    steps:
      - name: Sign in to Azure using GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Retrieve Marketplace resource ID
        shell: bash
        run: |
          response="$(
            az rest \
              --method GET \
              --url "https://app.vssps.visualstudio.com/_apis/profile/profiles/me?api-version=7.1" \
              --resource "499b84ac-1321-427f-aa17-267ca6975798"
          )"

          resource_id="$(jq -r '.id // empty' <<< "$response")"

      - name: Verify Marketplace publishing permission
        shell: bash
        run: |
          npx --yes @vscode/vsce verify-pat \
            DarndestDabbler \
            --azure-credential
            
       
