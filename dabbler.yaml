# dabbler.yaml -- what this repository declares about itself.
#
# Tracked, unlike local-overrides.yaml, because CI reads these facts and so
# does the next machine to pick up a session. Precedence is the packaged
# router-config.yaml, then this file, then local-overrides.yaml.
# Providers, models, roles and transports are deliberately absent: those are
# distribution facts, and a repository that restated them here would fork the
# model registry in order to say how to run a test suite.
schema_version: 1

# Step (f) of the session lifecycle: pack, then push to a feed. A session that
# declared itself releasable at step (a) publishes through `packaging.pack`
# and `packaging.push` -- both argv, never shell strings, both spawned with
# the child-environment allowlist, and `push` naming the credential rather
# than holding it. The framework substitutes `{output}`, `{artifact}`,
# `{feed}` and `{secret}` per argv element at spawn time.
#
# This repository declares none, and that is a declaration rather than a gap.
# It publishes TWO artifacts to two registries -- the router to npm, the
# extension to the VS Code Marketplace -- and the block describes one pack
# and one push. Half of a release declared here would be worse than none: the
# packaging record would read as this repository's release history while
# naming one of the two things it releases.
#
# Both go out through their tag-driven pipelines under `.github/workflows/`,
# which publish over OIDC and are gated on a green `Test` run for the tagged
# commit. A session prepares a release; a tag push makes it, and that is the
# operator's.
#
# Where the block goes when there IS one is here, not in
# local-overrides.yaml: which feed a repository publishes to is a fact about
# the repository, the record attributes the push to it, and the overlay is
# refused the key for exactly that reason. Only the credential is machine
# state, and `secret` names it rather than holding it.
#
#   packaging:
#     pack:
#       argv: ["dotnet", "pack", "-c", "Release", "-o", "{output}"]
#     push:
#       argv: ["dotnet", "nuget", "push", "{artifact}",
#              "--source", "{feed}", "--api-key", "{secret}"]
#       feed: https://pkgs.dev.azure.com/<org>/_packaging/<feed>/nuget/v3/index.json
#       secret: DABBLER_FEED_PAT

# Which tests a change makes necessary, and what proves the suite was green.
#
# Pre-verification runs the selected tests only. The full suite is recorded
# once, against the final verified tree -- never as ordinary pre-verification
# evidence.
testing:
  suites:
    # The router's tests, rebuilt from session 83 on (session plan, "Why
    # sessions 83-88 exist"): Node's own runner over packages/router/test,
    # pure functions tested plainly and a handful of chained walkthroughs.
    # Node expands the glob itself, so the argv needs no shell, and a
    # positional file appended by the targeted form
    # `<command> packages/router/test/x.test.ts` is one more pattern (D116).
    - name: typescript
      command: node --test packages/router/test/**/*.test.ts
      expensive: false
      covers:
        - packages/router/
        - package.json
        - package-lock.json
        - dabbler.yaml
      test_roots:
        - packages/router/test
      test_glob: "*.test.ts"

    # The vitest files not yet rewritten, under packages/router/test-vitest.
    # This is the default tier only -- the files that spawn nothing. The
    # integration tier (vitest.integration.config.ts, INTEGRATION_FILES) is
    # NOT declared here for the duration of the rebuild: on the operator's
    # authorisation of 2026-09-03 it is not run on the developer's machine,
    # because it takes the keyboard for the duration; CI runs it on every
    # push (.github/workflows/test.yml) and is its run of record until
    # session 88 deletes it. This suite goes with session 88 too.
    - name: typescript-vitest
      command: npx vitest run --root packages/router
      expensive: false
      covers:
        - packages/router/
        - package.json
        - package-lock.json
        - dabbler.yaml
      test_roots:
        - packages/router/test-vitest
      test_glob: "*.test.ts"

    # The VS Code extension. Declared in session 39 against D242, which
    # session 37 found by being the first session in a long while to change
    # only extension files: `tools/` was covered by nothing, so `dabbler
    # affected` selected zero tests, no preverification evidence could
    # honestly be recorded, and the session could have closed with every gate
    # green having run nothing. That is `csv-model` feedback item 3's defect
    # on this repository, and sessions 41, 42, 43 and 47 are all
    # extension-heavy.
    #
    # `runs_whole` because the runner is an npm script with its spec glob
    # baked in: naming a file after it ADDS to the glob rather than narrowing
    # it, so there is no targeted form to invent. The complete run is the
    # smallest honest evidence, and at roughly three seconds that costs
    # nothing worth optimising.
    - name: extension
      command: npm run test:unit -w dabbler-ai-orchestration
      expensive: true
      runs_whole: true
      covers:
        - tools/dabbler-ai-orchestration/
        - package.json
        - package-lock.json
        - dabbler.yaml
      test_roots:
        - tools/dabbler-ai-orchestration/src/test/suite
      test_glob: "*.test.ts"

  # Deterministic controls — one entry per kind, from compile, typecheck,
  # lint, analyzer. A declared control runs before verification and its
  # exit code is the fact; `required` sends a red result back to the
  # author instead of buying a verifier's opinion on something the exit
  # code already settled.
  #
  # Every command here is argv for `node`, never `npm` or `npx`: a
  # control is run as argv with no shell, and on Windows those are shim
  # scripts that argv cannot reach. `node` is an executable everywhere.
  controls:
    # The generated types are the compiled form of the twenty-one
    # schemas. Stale output is a build that was not re-run, which is
    # what `compile` means here.
    - kind: compile
      command: node packages/router/scripts/run-ts.mjs packages/router/scripts/check-types-fresh.ts
      required: true
    - kind: typecheck
      command: node packages/router/scripts/run-ts.mjs packages/router/scripts/workspace-check.ts typecheck
      required: true
    - kind: lint
      command: node packages/router/scripts/run-ts.mjs packages/router/scripts/workspace-check.ts lint
      required: true

  selection:
    # Changing one of these changes what every test does, so the selector can
    # prove the whole suite is affected instead of an operator asserting it.
    # They used to name each affected test file by hand -- eleven of them,
    # listed four times -- which was an approximation of "all of them" that
    # went stale every time a test file was added.
    repo_wide:
      - package.json
      - package-lock.json
      - packages/router/tsconfig.json
      # This file DECLARES the suites, their commands and their surfaces, so a
      # change to it changes what every suite does. It was mapped to nothing
      # and fell through to the smoke test -- the selector reported
      # `selection_unknown: dabbler.yaml` while the operator was editing the
      # declaration the selector reads.
      - dabbler.yaml

    # Run when a changed path maps to nothing. Cheap, broad, and enough to
    # notice a structural break -- not a substitute for a real mapping.
    smoke:
      - packages/router/test/contracts.test.ts

    rules:
      # The extension's own sources. The suite `runs_whole`, so this list
      # decides what the record NAMES, never what actually runs -- a test file
      # added and not listed here still runs, and the failure direction is
      # therefore under-naming rather than under-running.
      - when: tools/dabbler-ai-orchestration/src/
        select:
          - tools/dabbler-ai-orchestration/src/test/suite/actionRegistry.test.ts
          - tools/dabbler-ai-orchestration/src/test/suite/commandFlows.test.ts
          - tools/dabbler-ai-orchestration/src/test/suite/fileSystem.test.ts
          - tools/dabbler-ai-orchestration/src/test/suite/sessionsModel.test.ts
          - tools/dabbler-ai-orchestration/src/test/suite/solutionTreeModel.test.ts
          - tools/dabbler-ai-orchestration/src/test/suite/specSectionLocator.test.ts
          - tools/dabbler-ai-orchestration/src/test/suite/terminalShim.test.ts
          - tools/dabbler-ai-orchestration/src/test/suite/workExplorerTreeModel.test.ts
      # The extension manifest decides which commands, views and menus exist,
      # which is what half the extension suite asserts.
      - when: tools/dabbler-ai-orchestration/package.json
        select:
          - tools/dabbler-ai-orchestration/src/test/suite/actionRegistry.test.ts
          - tools/dabbler-ai-orchestration/src/test/suite/commandFlows.test.ts
      # The scripts under `packages/router/scripts` are the declared
      # controls' own entry points — the controls run them, so they map
      # to no test rather than to an unknown.
      - when: packages/router/src/schema/
        select:
          - packages/router/test/schema.test.ts
      - when: packages/router/src/generated/
        select:
          - packages/router/test/schema.test.ts
          - packages/router/test/typed-payloads.test.ts
      - when: packages/router/src/contracts/
        select:
          - packages/router/test/contracts.test.ts
          - packages/router/test/typed-payloads.test.ts
      # The command's own files: the verb registry, the verbs' entry points
      # and the one seam every verb writes through. The report is what the
      # metrics test reads, so it answers for them too.
      - when: packages/router/src/cli/
        select:
          - packages/router/test/contracts.test.ts
          - packages/router/test/metrics.test.ts
          - packages/router/test/lifecycleCli.test.ts
          # `session report` and `session drive` are parsed here and proven
          # there: the driver's contract by the report verb's refusals, the
          # loop by a scripted engine.
          - packages/router/test/driver.test.ts
          - packages/router/test/drive.test.ts
          - packages/router/test/engines.test.ts
      # The driver's ledger (the four answers and the run's state) and the
      # loop that fills it. The loop's test drives a whole session through
      # every verb the typed lifecycle has, so a change to either file is a
      # change to what a driven session leaves behind.
      - when: packages/router/src/driver.ts
        select:
          - packages/router/test/driver.test.ts
          - packages/router/test/drive.test.ts
      - when: packages/router/src/drive.ts
        select:
          - packages/router/test/drive.test.ts
      # How the loop reaches an engine: the measured argv shapes, the
      # renderers and the adapters are their own file; the loop's test
      # drives through the command adapter and the interrupt.
      - when: packages/router/src/engines.ts
        select:
          - packages/router/test/engines.test.ts
          - packages/router/test/drive.test.ts
      - when: packages/router/src/index.ts
        select:
          - packages/router/test/contracts.test.ts
      # The ported modules. A module's own test comes first; the others are
      # the modules that IMPORT it, because a leaf of the import graph
      # breaking shows up in its dependants and not in itself.
      - when: packages/router/src/config.ts
        select:
          - packages/router/test/config.test.ts
          - packages/router/test/metrics.test.ts
          - packages/router/test/identity.test.ts
          - packages/router/test/selection.test.ts
      - when: packages/router/src/verdict.ts
        select:
          - packages/router/test/verdict.test.ts
      - when: packages/router/src/identity.ts
        select:
          - packages/router/test/identity.test.ts
      - when: packages/router/src/metrics.ts
        select:
          - packages/router/test/metrics.test.ts
          - packages/router/test/route.test.ts
      - when: packages/router/src/lockfile.ts
        select:
          - packages/router/test/lockfile.test.ts
          - packages/router/test/metrics.test.ts
          - packages/router/test/discovery.test.ts
      - when: packages/router/src/secretResolver.ts
        select:
          - packages/router/test/secretResolver.test.ts
      - when: packages/router/src/runtimeMode.ts
        select:
          - packages/router/test/runtimeMode.test.ts
      - when: packages/router/src/journal.ts
        select:
          - packages/router/test/config.test.ts
          - packages/router/test/record.test.ts
      # The record: the ledger, the critique subtree, the sanctioned
      # writers, the lifecycle flow that reaches them, and the three
      # forward slices they are built on. One test file answers for all of
      # them, because what it proves is one thing -- the rules the record
      # is made of -- and splitting it per module would put the folds and
      # the refusals they protect in different files.
      - when: packages/router/src/ledger.ts
        select:
          - packages/router/test/record.test.ts
          - packages/router/test/projection.test.ts
      - when: packages/router/src/critique.ts
        select:
          - packages/router/test/record.test.ts
      - when: packages/router/src/writers.ts
        select:
          - packages/router/test/record.test.ts
          - packages/router/test/lifecycle.test.ts
      - when: packages/router/src/session.ts
        select:
          - packages/router/test/record.test.ts
          - packages/router/test/lifecycle.test.ts
          - packages/router/test/lifecycleCli.test.ts
      - when: packages/router/src/progress.ts
        select:
          - packages/router/test/record.test.ts
          - packages/router/test/projection.test.ts
          - packages/router/test/gates.test.ts
      # The evidence protocol and the record are two readers of one module:
      # the round anchor and the digest ledger are what `record.test.ts`
      # exercises, and the transcripts, quote provenance and absence
      # searches are `evidence.test.ts`.
      - when: packages/router/src/evidence.ts
        select:
          - packages/router/test/record.test.ts
          - packages/router/test/evidence.test.ts
      # The close's five gates. `record.test.ts` still answers for the
      # declaration's half of `materialWorktreeChanges`; the gates
      # themselves and the driver are their own file.
      - when: packages/router/src/gates.ts
        select:
          - packages/router/test/gates.test.ts
          - packages/router/test/record.test.ts
          - packages/router/test/lifecycle.test.ts
      # The module manifest: one reader, one writer, one command line.
      - when: packages/router/src/modules.ts
        select:
          - packages/router/test/lifecycle.test.ts
          - packages/router/test/lifecycleCli.test.ts
      # The pre-verification stage. `checks` is the leaf -- the declaration,
      # the path grammar and the executor -- so it selects its own test and
      # the two modules that import it; `test_evidence` and `affected` are
      # one claim asked twice and share a file.
      - when: packages/router/src/checks.ts
        select:
          - packages/router/test/checks.test.ts
          - packages/router/test/preverify.test.ts
          # The seat and the engines spawn through `checks.spawnProgram`.
          - packages/router/test/copilot.test.ts
          - packages/router/test/engines.test.ts
      - when: packages/router/src/testEvidence.ts
        select:
          - packages/router/test/preverify.test.ts
      - when: packages/router/src/affected.ts
        select:
          - packages/router/test/preverify.test.ts
      # Every record file is written through it, and `metrics` appends its
      # telemetry the same way.
      # Routing: the role rule both transports resolve through, the one
      # dispatch body over them, and the record of what currently exists.
      # `selection.test.ts` carries the escalation triggers as well, because
      # they live in `route.ts` and are what selection walks the ladder for.
      - when: packages/router/src/selection.ts
        select:
          - packages/router/test/selection.test.ts
          - packages/router/test/route.test.ts
      - when: packages/router/src/route.ts
        select:
          - packages/router/test/route.test.ts
          - packages/router/test/selection.test.ts
      # `session start` prints its staleness warnings, so the record's own
      # test file answers for that half.
      - when: packages/router/src/discovery.ts
        select:
          - packages/router/test/discovery.test.ts
          - packages/router/test/record.test.ts
      - when: packages/router/src/pythonJson.ts
        select:
          - packages/router/test/record.test.ts
          - packages/router/test/lockfile.test.ts
          - packages/router/test/metrics.test.ts
      - when: packages/router/src/textfile.ts
        select:
          - packages/router/test/config.test.ts
          - packages/router/test/metrics.test.ts
      - when: packages/router/src/version.ts
        select:
          - packages/router/test/lockfile.test.ts
      # Where the bundled config, the schemas and the templates are found.
      # Every module that reads one of them depends on this answer.
      - when: packages/router/src/paths.ts
        select:
          - packages/router/test/config.test.ts
          - packages/router/test/metrics.test.ts
          - packages/router/test/identity.test.ts
          - packages/router/test/schema.test.ts
      # Where the router is STANDING, which is the other half of the same
      # question: every path a caller does not name resolves from it, and
      # in-process there is no process-wide answer to fall back to.
      - when: packages/router/src/workdir.ts
        select:
          - packages/router/test/inProcess.test.ts
          - packages/router/test/config.test.ts
      # The contract's one implementation. It reaches every verb through its
      # own handler, so its test is the only one that drives the seam; the
      # extension is the caller and its suite is not declared here (D116).
      - when: packages/router/src/inProcess.ts
        select:
          - packages/router/test/inProcess.test.ts
      # The seat has two halves and they are read from different places. The
      # catalog, the dispatch state machine and the handoff are `transports/`;
      # what a seat SPENT is read from a store the Copilot CLI owns, so it is
      # its own module with its own file.
      - when: packages/router/src/seatCost.ts
        select:
          - packages/router/test/seatCost.test.ts
      # The deterministic pass. `verify` runs it before every round and
      # `verify step close` runs it again per step, so a change here is a
      # change to what both of those prove.
      - when: packages/router/src/facts.ts
        select:
          - packages/router/test/facts.test.ts
          - packages/router/test/verify.test.ts
      # The verification loop, split by seam. One rule for the directory
      # rather than one per file: the seams call each other -- the loop
      # reads the prompts, the cap reads the dispute ladder, the steps read
      # the loop's HEAD resolution -- so a change to any of them is a change
      # to the round, and naming them individually would be a list to forget
      # to add to.
      - when: packages/router/src/verify/
        select:
          - packages/router/test/verify.test.ts
          - packages/router/test/verdict.test.ts
      - when: packages/router/src/transports/

        select:
          - packages/router/test/transports.test.ts
          - packages/router/test/copilot.test.ts
          - packages/router/test/route.test.ts
          - packages/router/test/discovery.test.ts
          - packages/router/test/config.test.ts
          - packages/router/test/identity.test.ts
      # Not a test file: the suite's glob is `*.test.ts`, so nothing under
      # it is collected -- but every test that builds a config uses it.
      - when: packages/router/test/support/
        select:
          - packages/router/test/config.test.ts
          - packages/router/test/metrics.test.ts
          - packages/router/test/lockfile.test.ts
          - packages/router/test/transports.test.ts
          - packages/router/test/selection.test.ts
          - packages/router/test/route.test.ts
      - when: packages/router/scripts/
        select: []
      - when: packages/router/build.mjs
        select: []
      - when: packages/router/.eslintrc.json
        select: []
      # `packages/router/package.json` is the router's own manifest and
      # the file `version.ts` reads its stamp from; the three that change
      # what EVERY test compiles and links against are `repo_wide` above.
      - when: packages/router/package.json
        select:
          - packages/router/test/lockfile.test.ts
      # The extension's two layers -- mocha over the vscode stub, and
      # Playwright -- are not declared suites, so no declared test answers
      # for this path and the empty list is what the selector can truly
      # say. It is not what a reader should take away: the mocha layer is
      # exactly the test that notices this source breaking, and CI runs it
      # on every push.
      #
      # Declaring it is owed, and it is D116's shape rather than a line
      # here. `targeted_command` appends the selected paths to the
      # declared command, and mocha MERGES a path list with its `spec`
      # (whether the spec comes from the command line or from
      # `.mocharc.json`) instead of being narrowed by it -- measured, both
      # forms. So the bare command cannot mean "the whole suite" and the
      # appended form mean "these tests", and the honest declaration needs
      # a runner entry point of its own. `runs_whole` would be the cheap
      # way through and it would be false: mocha does take a subset.
      - when: tools/dabbler-ai-orchestration/
        select: []
      - when: packages/router/schemas/
        select:
          - packages/router/test/schema.test.ts
          - packages/router/test/typed-payloads.test.ts
      - when: packages/router/prompt-templates/
        select:
          - packages/router/test/verify.test.ts
      - when: packages/router/copilot-catalog.lock
        select:
          - packages/router/test/copilot.test.ts
      - when: packages/router/router-config.yaml
        select:
          - packages/router/test/config.test.ts
          - packages/router/test/route.test.ts
          - packages/router/test/selection.test.ts
      - when: docs/
        select: []
      - when: .github/
        select: []
      - when: README.md
        select: []
      - when: STATUS.md
        select: []
      - when: AGENTS.md
        select: []
      - when: CLAUDE.md
        select: []
      - when: GEMINI.md
        select: []
      - when: .gitignore
        select: []
