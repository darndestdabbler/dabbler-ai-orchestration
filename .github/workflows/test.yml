name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  drift-guards:
    name: Drift guards
    runs-on: ubuntu-latest
    # See the note on `playwright-tests`: no job here declared a timeout, so
    # nothing could stop a hang before GitHub's six-hour ceiling. These
    # dependency-light gates finish in well under a minute.
    timeout-minutes: 10
    # Set 058 S3 (D6/D8): a fast gate that fails the build if more than one
    # session set is in-progress at once, if the committed dist/ template
    # bundle drifts from its canonical source, if the model registry names an
    # id its provider does not offer, or if a workflow action is not
    # SHA-pinned. The same checks also run inside the pytest suite
    # (ai_router/tests/test_drift_guard.py); this job surfaces them as a
    # clearly-named standalone gate.
    #
    # Set 112 S2 retired the sixth check, the stale-framing guard: it policed
    # the "Lightweight = no Python / no venv" framing, and the Lightweight
    # tier it defended no longer exists.
    #
    # Set 110 S4 — THIS JOB HAD BEEN RED ON EVERY COMMIT, for two reasons that
    # both trace to one change: `run_all` grew
    # `check_model_registry_matches_providers`, and that check is NOT
    # stdlib-only. It imports `ai_router.model_inventory` and calls
    # `config.load_config()`, so the job needs BOTH:
    #
    #   1. the package installed — without it the guard reports "could not
    #      import the model-inventory check (No module named 'ai_router')" and
    #      fails rather than passing silently (which is the right behaviour);
    #   2. provider API keys — `load_config()` validates them under the tracked
    #      `api` transport profile.
    #
    # The original "uses only the Python stdlib, so no install step is needed"
    # comment stopped being true when that check landed, and the job kept the
    # install-free shape. It went unnoticed locally because a developer machine
    # runs the guard from a venv that HAS the package, and this repo's
    # gitignored ai_router/local-overrides.yaml selects the copilot-cli profile,
    # which skips the API-key check outright — green on the machine, red on CI,
    # for the same commit.
    env:
      DABBLER_ANTHROPIC_API_KEY: ci-dummy-anthropic-key
      DABBLER_GEMINI_API_KEY: ci-dummy-gemini-key
      DABBLER_OPENAI_API_KEY: ci-dummy-openai-key
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install ai_router (the model-registry check imports it)
        run: pip install -e .

      - name: Run consumer-bootstrap / CI drift guards
        run: python ai_router/scripts/drift_guard.py

      # Set 107 S2: the tutorial-fidelity gate. Set 106 shipped an equivalent
      # script inside its own session-set folder, where no job ever ran it.
      # This one keeps docs/tutorials/ bound to the product (every
      # `Dabbler: <Title>` resolves to a contributed command, every relative
      # link resolves) and to the sample bundle (the 15-minute first run quotes
      # bundle.json's real output, test count and paths), and enforces the
      # negative constraint that makes hello-world.md a FIRST run: no git
      # commands, no YAML, no host or governance vocabulary. Stdlib only, so it
      # needs no install step. Also run by pytest
      # (ai_router/tests/test_tutorial_gate.py).
      - name: Run tutorial-fidelity gate
        run: python ai_router/scripts/tutorial_gate.py

      # Set 112 S3: the anti-resurrection gate for the removed Lightweight
      # tier. Set 112 deleted the tier; this is the executable proof that
      # the deletion holds, so the tier cannot come back one plausible
      # commit at a time. It classifies by POSITION, not by an allowlist of
      # sanctioned files: comments, docstrings and markdown prose may explain
      # the removal freely (the migration message, the historical note, the
      # cross-repo notice and the changelogs all name it), while code
      # outside comments, fenced code blocks, and YAML/JSON bodies may not
      # declare it. Stdlib only, so it needs no install step. Also run by
      # pytest (ai_router/tests/test_lightweight_resurrection_guard.py),
      # which additionally proves the gate CATCHES planted resurrections --
      # a gate that only ever passes proves nothing.
      - name: Run Lightweight-tier anti-resurrection gate
        run: python ai_router/scripts/lightweight_resurrection_guard.py

  guidance-ceiling:
    name: Preload guidance ceiling gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Set 085 F1: the ratcheting preload-ceiling gate. `guidance_report
    # --check` fails the build if any required-reading file is over its
    # per-file ceiling or the corpus is over its total_ceiling_tokens, so
    # the manifest in router-config.yaml is the single anti-rebloat
    # enforcement point (ceilings ratchet down only). The check reads the
    # config via config.load_config() when it can, but is fail-CLOSED: if
    # that load fails (e.g. a malformed config) it recovers the manifest
    # from a raw YAML parse and, if it still cannot confirm it, exits
    # non-zero rather than silently passing on the legacy path. The dummy
    # provider keys below keep load_config() on its happy path (env
    # validation), matching the python-tests job.
    env:
      DABBLER_ANTHROPIC_API_KEY: ci-dummy-anthropic-key
      DABBLER_GEMINI_API_KEY: ci-dummy-gemini-key
      DABBLER_OPENAI_API_KEY: ci-dummy-openai-key
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install ai_router (config loader needs pyyaml)
        run: pip install -e .

      - name: Check preload guidance ceilings
        run: python -m ai_router.guidance_report --check

  template-snapshot:
    name: Consumer-bootstrap template snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Set 058 S3 (D8): enforce the cold-start golden snapshot in CI. The full TS
    # unit suite is not run in CI (two pre-existing Set-026 specs fail under the
    # vscode-stub), so the snapshot guard would otherwise be local-only. This
    # job runs ONLY the writer-render and golden-snapshot specs directly via
    # mocha + ts-node — both pass cleanly and have no VS Code dependency — so a
    # template edit that changes rendered output without a regenerated golden
    # fails CI here.
    defaults:
      run:
        working-directory: tools/dabbler-ai-orchestration
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "20"

      - name: Install extension dependencies
        run: npm ci

      - name: Run consumer-bootstrap render + cold-start golden snapshot specs
        run: >-
          npx mocha --require ts-node/register
          --require ./src/test/vscode-stub.js --ui tdd --timeout 120000
          'src/test/suite/consumerBootstrap.test.ts'
          'src/test/suite/coldStartSnapshot.test.ts'
          'src/test/suite/electronBinaryLookup.test.ts'

      # electronBinaryLookup.test.ts rides in this Node-only job on purpose:
      # it drives the Layer-3 macOS binary lookup through injected IO, so the
      # macOS-only branch is exercised on EVERY push from a Linux runner. The
      # bug it covers went undetected for twelve commits precisely because
      # nobody developing on Windows could run the code path that broke.

  sample-project-smoke:
    name: Sample-project smoke (Set 107)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    # Set 107 S1: the executable acceptance floor for `Dabbler: Try a sample
    # project`. Layer 2 as a whole is skipped in CI (see the note at the
    # bottom of this file), so these two specs run directly via mocha +
    # ts-node — the same pattern the template-snapshot job uses. Without this
    # job the sample would be local-only-tested and would rot silently, which
    # is exactly the failure L-064-12 records.
    #
    # The smoke spec drives real subprocesses: `git`, and `python -m
    # ai_router.{start,close}_session` against a genuinely empty temp folder.
    # It therefore needs BOTH runtimes on the runner, and a git identity —
    # the walk deliberately proves the sample's repo-LOCAL identity works, so
    # the runner must not supply a global one that would mask a regression.
    # Both OSes run it because the resume marker, the venv path shape, and
    # the working-tree cleanliness check are all platform-sensitive.
    env:
      DABBLER_ANTHROPIC_API_KEY: ci-dummy-anthropic-key
      DABBLER_GEMINI_API_KEY: ci-dummy-gemini-key
      DABBLER_OPENAI_API_KEY: ci-dummy-openai-key
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install ai_router (the sample's lifecycle shells out to it)
        run: pip install -e .

      - name: Set up Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "20"

      - name: Install extension dependencies
        run: npm ci
        working-directory: tools/dabbler-ai-orchestration

      - name: Run the sample-project core + smoke specs
        working-directory: tools/dabbler-ai-orchestration
        run: >-
          npx mocha --require ts-node/register
          --require ./src/test/vscode-stub.js --ui tdd --timeout 180000
          'src/test/suite/sampleProjectCore.test.ts'
          'src/test/suite/sampleProjectSmoke.test.ts'

  provisioning-dogfood:
    name: Provisioning dogfood (Set 122)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    # Set 122 S3: the L-079-3 cold-start dogfood for the router version
    # floor. Layer 2 as a whole is skipped in CI (see the note at the
    # bottom of this file) and this lane is not part of it anyway, so
    # without this job the dogfood would be local-only and would rot
    # silently — the exact failure L-064-12 records, and the same
    # reasoning that gave the sample-project smoke its own job.
    #
    # What it guards is a REGRESSION WITH A KNOWN VICTIM: the extension
    # shells out to `python -m ai_router.modules`, and a plain
    # `pip install` reports an existing older router as already-satisfied.
    # These scenarios install a real historical `dabbler-ai-router==0.34.0`
    # from PyPI and assert setup upgrades past the floor, so a future edit
    # that drops `--upgrade` or the pinned requirement fails here rather
    # than in a developer's venv after a Marketplace update.
    #
    # It needs BOTH runtimes (real `python -m venv` + real `pip install`,
    # driven from Node) and the network. Both OSes run it because the venv
    # interpreter path shape and the base-interpreter resolution are
    # platform-sensitive.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      # The lane's venv-isolation check asserts that an EMPTY venv cannot
      # import `ai_router.modules` while the HOST interpreter can — which
      # is what makes that assertion a real discrimination rather than a
      # universally-true statement. On a clean runner there is no repo-root
      # `.venv`, so the host interpreter is this one and it must carry the
      # checkout's own package. Same step, same reason, as the
      # sample-project smoke job.
      - name: Install ai_router into the host interpreter
        run: pip install -e .

      - name: Set up Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "20"

      - name: Install extension dependencies
        run: npm ci
        working-directory: tools/dabbler-ai-orchestration

      - name: Run the provisioning dogfoods
        working-directory: tools/dabbler-ai-orchestration
        run: npm run test:dogfood

  python-tests:
    name: Python tests
    runs-on: ${{ matrix.os }}
    # macOS stays HERE deliberately. It is green throughout the Layer 3
    # outage and cheap, so the router keeps real macOS coverage even though
    # the GUI suite no longer runs there. The suite is ~4 minutes with
    # `-n auto`; 30 leaves room for a cold cache on a contended runner.
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # load_config() validates that API-key env vars exist for every
    # enabled provider in router-config.yaml (anthropic / gemini /
    # openai). The tests don't make real provider calls — the load
    # validator just checks for env presence. Dummy values are
    # sufficient and avoid leaking real credentials through CI logs.
    env:
      DABBLER_ANTHROPIC_API_KEY: ci-dummy-anthropic-key
      DABBLER_GEMINI_API_KEY: ci-dummy-gemini-key
      DABBLER_OPENAI_API_KEY: ci-dummy-openai-key
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install ai_router with test dependencies
        run: pip install -e .[tests]

      - name: Run pytest (all marks including e2e)
        run: python -m pytest -v

  playwright-tests:
    name: Playwright Layer 3
    runs-on: ${{ matrix.os }}
    # 2026-08-11: no job in this file declared a timeout, so nothing could
    # stop a hung suite before GitHub's SIX-HOUR ceiling. The macOS outage
    # billed 149 minutes per run at the 10x macOS multiplier -- 1,491
    # billable minutes each, ~65,600 across the 44 failed runs -- and 149
    # minutes was luck, not a bound. A passing full Layer 3 run is ~11
    # minutes (36 passed in 10.6m, measured 2026-08-11), so 30 is ~3x
    # headroom for a slow or contended runner while capping a hang at 30
    # minutes. If a legitimate run ever approaches this, raise it
    # deliberately -- do not remove it.
    timeout-minutes: 30
    strategy:
      # 2026-07-30: fail-fast was HIDING the real per-OS picture. When the
      # macOS leg failed on a stale binary-lookup path, GitHub cancelled the
      # other two — so the Linux leg (which was passing its specs cleanly) and
      # the Windows leg (still downloading VS Code) both reported as failures
      # with no results at all. That is precisely the trap L-064-12 warns
      # about: "treat CANCELLED jobs as unknown coverage, not passing
      # coverage." Run all three to completion; a red matrix should say WHICH
      # platform is red.
      fail-fast: false
      matrix:
        # 2026-08-11: macOS REMOVED from Layer 3 on cost grounds (operator
        # decision). GUI runs there billed 149 wall-clock minutes at the 10x
        # macOS multiplier -- 1,491 billable minutes per run, ~65,600 across
        # the 44 failed runs since 2026-08-04, against a plan that includes
        # 3,000/month. The failure mode was maximally expensive: each of the
        # 36 specs waited out a 30s click timeout plus 90s afterEach plus 90s
        # worker teardown, single-worker, no early exit -- so a FAILING run
        # cost more than a passing one.
        #
        # What was wrong: every spec failed at one shared choke point
        # (`electronLaunch.ts:847`, the activity-bar click in
        # openDabblerContainer), hanging on Playwright's "visible, enabled
        # and stable" precondition. The element resolved and passed the
        # `waitFor({state:"visible"})` on the line above, then never produced
        # two consecutive stable frames. 100% failure at one choke point, a
        # break that landed on a DOCS-ONLY commit, and Python-on-macOS green
        # throughout all point at the environment: the job env reports
        # `arm64`, so `macos-latest` had rotated to Apple Silicon.
        # `downloadAndUnzipVSCode()` takes no arguments and auto-detects the
        # platform, so the VS Code build fetched was correct -- this was
        # about compositing Electron frames, not the wrong binary.
        #
        # THIS IS NOT DROPPING macOS SUPPORT. Two things still cover it:
        #   1. `Python tests (macos-latest)` below stays, and stayed green
        #      throughout -- the router keeps real macOS coverage, cheaply.
        #   2. `electronBinaryLookup.test.ts` drives the Layer-3 macOS-only
        #      binary-lookup branch through injected IO on EVERY push from a
        #      Linux runner -- the macOS code path that historically broke is
        #      still exercised on every commit.
        # What is lost is macOS GUI verification: the extension still
        # installs and runs there, it is no longer tested there. Reversible
        # the moment a macOS user appears, ideally with the timeout above
        # kept so a repeat cannot bill hours.
        os: [ubuntu-latest, windows-latest]
    # Same dummy API-key envs the python-tests job uses. Several
    # Layer-3 specs shell out to `python -m ai_router.start_session`
    # / `ai_router.new_chat_id` / `ai_router.close_session` via
    # electronLaunch.ts's harness_cli helper, and those CLIs import
    # config.load_config() at startup which validates the env is set.
    env:
      DABBLER_ANTHROPIC_API_KEY: ci-dummy-anthropic-key
      DABBLER_GEMINI_API_KEY: ci-dummy-gemini-key
      DABBLER_OPENAI_API_KEY: ci-dummy-openai-key
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "20"

      # Several Layer-3 specs shell out to `python -m ai_router.*`
      # CLIs (start_session, close_session, new_chat_id) via the
      # harness_cli helper in electronLaunch.ts. The ai_router
      # package must be importable on the Playwright job's runner —
      # the separate python-tests job's install does not carry
      # across.
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install ai_router (importable by python -m ai_router.* shell-outs)
        run: pip install -e .

      - name: Install extension dependencies
        run: npm ci
        working-directory: tools/dabbler-ai-orchestration

      - name: Install Chromium for Playwright
        run: npx playwright install chromium
        working-directory: tools/dabbler-ai-orchestration

      # src/test/playwright/electronLaunch.ts findCodeBinary() looks
      # for a VS Code binary cached under .vscode-test/ (the canonical
      # @vscode/test-electron download location). On local dev that
      # directory gets populated the first time you run `npm test`,
      # which CI does NOT invoke (the @vscode/test-electron Layer-2
      # harness is broken on Windows 11 + VS Code 1.120). Without this
      # step Layer 3 throws "No VS Code binary found and .vscode-test
      # does not exist" before any test body runs. The script just
      # downloads + extracts the binary; it does not run any tests.
      - name: Download VS Code for Playwright (populates .vscode-test/)
        run: node -e "require('@vscode/test-electron').downloadAndUnzipVSCode()"
        working-directory: tools/dabbler-ai-orchestration

      - name: Run Playwright tests (Linux with xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run npm run test:playwright
        working-directory: tools/dabbler-ai-orchestration

      - name: Run Playwright tests (Windows/macOS)
        if: runner.os != 'Linux'
        run: npm run test:playwright
        working-directory: tools/dabbler-ai-orchestration

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: playwright-test-results-${{ matrix.os }}
          path: tools/dabbler-ai-orchestration/test-results/
          retention-days: 7

  # Layer 2 (@vscode/test-electron) is skipped in CI:
  # - Known broken on Windows 11 + VS Code 1.120 (code.exe / test-electron 2.5.2 arg incompatibility)
  # - Untested on macOS/Linux (needs explicit OS-specific binary paths, xvfb on Linux)
  # See: CLAUDE.md "Orchestrator e2e harness (Set 027)" and
  #      docs/implementation-summary-023-027.md "Key Insights & Hazards"
  # Layer 2 validation is a candidate for Set 028 follow-up if upstream fixes the Windows breakage.
