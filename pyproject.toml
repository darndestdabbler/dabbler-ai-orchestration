[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dabbler-ai-router"
version = "1.1.0"
description = "Multi-provider model routing, session lifecycle, and metrics for the Dabbler AI-led workflow (v2)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "darndestdabbler" }]
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "jsonschema>=4.0.0",
]

[project.optional-dependencies]
tests = [
    "pytest>=7.0",
    "pytest-xdist>=3.5",
    "pytest-cov>=5.0",
]

[tool.setuptools]
packages = ["ai_router", "ai_router.transports"]

[tool.setuptools.package-data]
ai_router = [
    "router-config.yaml",
    "copilot-catalog.lock",
    "prompt-templates/*.md",
    "schemas/*.json",
]

# Coverage writes under the machine-side directory, never the repo root.
# A stray `.coverage` is an untracked, unignored path, and the selector is
# obliged to treat one as a change it cannot map — which would turn the very
# command it just printed into a policy violation.
[tool.coverage.run]
data_file = ".dabbler/.coverage"
