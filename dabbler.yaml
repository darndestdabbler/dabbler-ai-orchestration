# dabbler.yaml -- what this repository declares about itself.
#
# Tracked, unlike local-overrides.yaml, because CI reads these facts and so
# does the next machine to pick up a session. Precedence is the packaged
# router-config.yaml, then this file, then local-overrides.yaml.
# Providers, models, roles and transports are deliberately absent: those are
# distribution facts, and a repository that restated them here would fork the
# model registry in order to say how to run a test suite.
schema_version: 1

# Step (f) of the session lifecycle: pack, then push to a feed. A session that
# declared itself releasable at step (a) publishes through `packaging.pack`
# and `packaging.push` -- both argv, never shell strings, both spawned with
# the child-environment allowlist, and `push` naming the credential rather
# than holding it. The framework substitutes `{output}`, `{artifact}`,
# `{feed}` and `{secret}` per argv element at spawn time.
#
# This repository declares none, and that is a declaration rather than a gap.
# It publishes TWO artifacts to two registries -- the router to npm, the
# extension to the VS Code Marketplace -- and the block describes one pack
# and one push. Half of a release declared here would be worse than none: the
# packaging record would read as this repository's release history while
# naming one of the two things it releases.
#
# Both go out through their tag-driven pipelines under `.github/workflows/`,
# which publish over OIDC and are gated on a green `Test` run for the tagged
# commit. A session prepares a release; a tag push makes it, and that is the
# operator's.
#
# Where the block goes when there IS one is here, not in
# local-overrides.yaml: which feed a repository publishes to is a fact about
# the repository, the record attributes the push to it, and the overlay is
# refused the key for exactly that reason. Only the credential is machine
# state, and `secret` names it rather than holding it.
#
#   packaging:
#     pack:
#       argv: ["dotnet", "pack", "-c", "Release", "-o", "{output}"]
#     push:
#       argv: ["dotnet", "nuget", "push", "{artifact}",
#              "--source", "{feed}", "--api-key", "{secret}"]
#       feed: https://pkgs.dev.azure.com/<org>/_packaging/<feed>/nuget/v3/index.json
#       secret: DABBLER_FEED_PAT

# THIS repository's answer, and it is the other kind. Everything above is
# still true -- there is no pack and no push here, and there cannot be: the
# Marketplace credential lives in a GitHub environment and never on this
# machine. What was missing was a way to SAY so. Declaring nothing meant a
# session could not be releasable at all, because the publish phase and the
# `published_when_releasable` gate both look for a packaging run and an
# absent block produces none; session 137 walked into exactly that, with its
# work landed and its release notes written.
#
# `release: tag` says: this repository's release is an annotated `vsix-v*`
# tag, `dabbler release` makes it, and `.github/workflows/publish-vscode.yml`
# publishes from it. The packaging run then RECORDS whether that tag reached
# origin -- it never makes it, because a tag published to everyone the moment
# CI sees it is the one act that waits on the operator's own `publication`
# decision rather than on a phase advancing.
packaging:
  release: tag

# Which tests a change makes necessary, and what proves the suite was green.
#
# Pre-verification runs the selected tests only. The full suite is recorded
# once, against the final verified tree -- never as ordinary pre-verification
# evidence.
testing:
  suites:
    # The router's tests, rebuilt from session 83 on (session plan, "Why
    # sessions 83-88 exist"): Node's own runner over packages/router/test,
    # pure functions tested plainly and a handful of chained walkthroughs.
    # Node expands the glob itself, so the argv needs no shell, and a
    # positional file appended by the targeted form
    # `<command> packages/router/test/x.test.ts` is one more pattern (D116).
    #
    # The `--import` preload is part of the run of record. Git is spawned by
    # the seven `walk-*` files and nowhere else: every other test feeds git's
    # answers through `journal.setGitSource` (test/support/answers.ts), and
    # `test/support/no-git.ts` fails a worker outside a walkthrough the
    # moment it spawns git, naming the test file. That seam made each storm
    # smaller: nothing outside the walkthroughs builds a repository, and a
    # run no longer fails a different file each time.
    #
    # `--test-concurrency=4` (D246) is a different protection and is back
    # from session 126. `node --test` runs one worker per CPU -- 20 on the
    # operator's machine -- and each walkthrough boots full CLI children
    # under its worker, so an uncapped run of record took the machine from
    # the operator twice a session. The cap keeps the box usable while the
    # run of record runs; it does not shorten the run (the slowest file is
    # the floor), and the measured cost is in `docs/design/suite-cost.md`.
    # Nothing audits the flag: a flag in a command line cannot lapse
    # silently the way the count below once did.
    #
    # That count is not decoration. It said FIVE from session 96 to 122
    # while the walkthroughs went six, seven, eight -- each admitted by a
    # filename pattern rather than a decision -- and the suite went from
    # 17 s to 157 s underneath the sentence claiming it was fine.
    # `no-git.ts` names the permitted files one by one now, and
    # `check-suite-cost.ts` fails the lint control when this number and that
    # list disagree. What the walkthroughs cost, and the one jump nobody has
    # explained, are in `docs/design/suite-cost.md`.
    # `expensive: true` is not a claim about cost -- 1144 tests in 157 s,
    # measured at session 121 on the operator's 20-thread host, and a
    # measurement carries the date it was taken rather than standing as a
    # property of the suite: the figure here read "1117 tests in 32 seconds"
    # from session 92 to 122 and was wrong for most of that time.
    # It is the flag that makes a suite the RUN OF RECORD, and it
    # gates two things at once: `drive.expensiveSuites()` filters the
    # run-of-record phase by it, and `testEvidence.evaluateFreshness` skips a
    # non-expensive suite outright. Turning it off removes the run and the
    # gate that would notice the run was missing, together.
    #
    # It was `false` here, and correctly so when session 83 declared this
    # tier BESIDE vitest and vitest was the expensive one. Session 88 retired
    # vitest and deleted its declaration; the survivor kept a flag whose
    # meaning died with the tier it was defined against. The cost: no run of
    # record for `packages/router/` between 2026-09-02 and session 92, while
    # sessions 90 and 91 both changed router source and both closed green on
    # the extension's suite alone. The refusal that makes it unrepeatable --
    # a surface covered only by a non-expensive suite -- is session 95's,
    # and it is the loader's: `loadSuitesChecked` names the suite.
    #
    # The command is a runner rather than `node --test` directly, from session
    # 153, and the flags did not change: `scripts/suite.mjs` spawns the same
    # `--test-concurrency=4` run with the same `no-git.ts` preload inside a
    # CPU-bounded Podman container. Measured on this machine on 2026-09-11:
    # 324 seconds on the host and 24.6 seconds there, whole door to whole
    # door, with the host's other 50 tests costing 1.8 s. The mechanism is
    # process creation, which session 136 already measured as this suite's
    # load -- a bare `node -e 0` spawn costs 158.8ms on this Windows host and
    # 18.9ms inside the WSL2 machine, and the walkthroughs boot a full CLI
    # child per job. Nothing was saturated on either side: twenty cores,
    # sixty-four gigabytes, four concurrent files.
    #
    # What that buys is the keyboard rather than the clock. Six minutes of
    # relentless spawning on the scheduler the editor shares leaves the
    # operator typing about one character every two or three seconds; four
    # cores inside a virtual machine takes the load off the host entirely.
    #
    # The image is built on demand from the `Containerfile` beside this file,
    # and three named volumes hold the Linux `node_modules` so the operator's
    # Windows ones are never read or written. Only this repository declares
    # any of it: nothing in the shipped framework changes, because the next
    # repository to adopt this framework is .NET or Java and would want none
    # of it. CI is not moved either -- both workflow jobs stay on
    # `windows-latest`, which is what proves the platform. The measurement,
    # that divergence and the tests that cannot run in the container are in
    # `docs/design/suite-runners.md`.
    # The other door, and it exists because of how the container fails rather
    # than how it succeeds. Measured on 2026-09-11 against the image beside
    # this file: run the whole 1,179 there and 32 come back
    # `cancelledByParent` while the file they are in still reports
    # `# fail 0`. A runner reading the failure count would call that green,
    # having silently stopped proving the transport this repository is
    # actually operated on. So the container door runs 1,129 and this one
    # runs the other 50.
    #
    # It is ONE file, and the measurement is what made it one. Three other
    # files failed in the container on the first pass and would have been
    # declared Windows-only on the strength of it: two because an orphaned
    # grandchild with no PID 1 to reap it stays a zombie, which
    # `process.kill(pid, 0)` answers for exactly as it answers for a live
    # process, and one because `node:22-slim` carries no `ps`, so the POSIX
    # branch of `survivors()` finds no process table and reaps nothing while
    # saying nothing. `--init` and `procps` fix all three. Writing them down
    # as proofs about Windows would have been three false sentences and a
    # container that had quietly stopped proving the job runner's reaping.
    #
    # It is declared FIRST, and the order is load-bearing rather than
    # cosmetic. Both doors draw from the same directory, so both name the same
    # `test_roots`, and `scopeForTest` attributes a test file to the FIRST
    # declared suite whose root and glob match it -- one owner per file, so
    # that naming every selected test to every runner cannot put a Java test
    # in a `dotnet test` command. Declared the other way round, `typescript`
    # would claim `copilot.test.ts`, the container runner would decline it as
    # not its own, and no targeted command would run it at all: the one test
    # this whole split exists to keep proving would be the one test that
    # stopped being proved.
    #
    # So this suite's glob names the file instead of a pattern. That is two
    # statements of one fact -- the glob here and
    # `scripts/suite-membership.json`, which carries the reason -- and
    # `scripts/check-suite-membership.mjs` holds them to each other and
    # refuses a manifest this glob cannot express, rather than letting the two
    # drift. `docs/design/suite-runners.md` carries the measurement, the
    # reason the one file is here, and why CI is not moved.
    - name: typescript-windows
      command: node scripts/suite.mjs host
      expensive: true
      covers:
        - packages/router/
        - package.json
        - package-lock.json
        - dabbler.yaml
        - Containerfile
        - scripts/suite.mjs
        - scripts/suite-membership.json
      test_roots:
        - packages/router/test
      test_glob: "copilot.test.ts"
      test_name: "{name}.test.ts"
      select: node scripts/suite.mjs host {paths}

    - name: typescript
      command: node scripts/suite.mjs container
      expensive: true
      covers:
        - packages/router/
        - package.json
        - package-lock.json
        - dabbler.yaml
        - Containerfile
        - scripts/suite.mjs
        - scripts/suite-membership.json
      test_roots:
        - packages/router/test
      test_glob: "*.test.ts"
      test_name: "{name}.test.ts"
      select: node scripts/suite.mjs container {paths}

    # The VS Code extension. Declared in session 39 against D242, which
    # session 37 found by being the first session in a long while to change
    # only extension files: `tools/` was covered by nothing, so `dabbler
    # affected` selected zero tests, no preverification evidence could
    # honestly be recorded, and the session could have closed with every gate
    # green having run nothing. That is `csv-model` feedback item 3's defect
    # on this repository, and sessions 41, 42, 43 and 47 are all
    # extension-heavy.
    #
    # It used to declare `runs_whole`, and the reason was true: the command
    # was an npm script with its spec glob baked in, mocha MERGES an appended
    # path list with its `spec` rather than being narrowed by it, and there
    # was no targeted form to invent. D116 recorded that the honest
    # declaration needed a runner entry point of its own.
    #
    # Session 91 built one. `scripts/run-unit.mjs` runs mocha from the
    # package directory with no baked-in glob when it is given specs, and it
    # resolves a path written either way -- against the repository, which is
    # what the selector appends, or against the package, which is what a
    # person copies out of package.json. So the bare command really is the
    # whole suite and the appended form really is those tests, and
    # `runs_whole` would now be a claim that is no longer true.
    #
    # `npm run test:unit` is unchanged and is still what CI runs: this
    # names the runner directly because a declared command is spawned as
    # written, and `node` is an executable on every host while `npm` is a
    # shim.
    #
    # From session 201 that runner runs inside the router suite's container,
    # through `scripts/suite.mjs extension`. Not for speed: the host is the
    # operator's machine, and it answered for the suite. Sessions 199 and 200
    # closed green here and failed on the GitHub runner, because `session
    # start` found this machine's `claude`, Copilot login and provider keys
    # and the runner has none of them. The container has none either, so a
    # run of record there fails where CI fails. Measured on 2026-09-17: every
    # spec passes in the container but the one that depended on the machine,
    # so none is kept on the host; `docs/design/suite-runners.md` carries it.
    - name: extension
      command: node scripts/suite.mjs extension
      expensive: true
      covers:
        - tools/dabbler-ai-orchestration/
        - package.json
        - package-lock.json
        - dabbler.yaml
        - Containerfile
        - scripts/suite.mjs
        - scripts/suite-membership.json
      test_roots:
        - tools/dabbler-ai-orchestration/src/test/suite
      test_glob: "*.test.ts"
      test_name: "{name}.test.ts"
      select: node scripts/suite.mjs extension {paths}

  # Deterministic controls — one entry per kind, from compile, typecheck,
  # lint, analyzer. A declared control runs before verification and its
  # exit code is the fact; `required` sends a red result back to the
  # author instead of buying a verifier's opinion on something the exit
  # code already settled.
  #
  # Every command here is argv for `node`, never `npm` or `npx`: a
  # control is run as argv with no shell, and on Windows those are shim
  # scripts that argv cannot reach. `node` is an executable everywhere.
  controls:
    # The generated types are the compiled form of the twenty-one
    # schemas. Stale output is a build that was not re-run, which is
    # what `compile` means here.
    - kind: compile
      command: node packages/router/scripts/run-ts.mjs packages/router/scripts/check-types-fresh.ts
      required: true
    - kind: typecheck
      command: node packages/router/scripts/run-ts.mjs packages/router/scripts/workspace-check.ts typecheck
      required: true
    - kind: lint
      command: node packages/router/scripts/run-ts.mjs packages/router/scripts/workspace-check.ts lint
      required: true

  selection:
    # Run when a changed source file has no test named after it. Cheap,
    # broad, and enough to notice a structural break -- not a substitute
    # for a test named after the file.
    #
    # It has to name a file that EXISTS, and for two sessions it did not:
    # session 83's rebuild deleted `contracts.test.ts` and this entry kept
    # naming it, so every unmapped path fell through to nothing at all. The
    # schema test is the structural one now -- it reads the verb registry
    # and both contract files and fails if they stop agreeing.
    smoke:
      - packages/router/test/schema.test.ts
