# ============================================================
# AI Router Configuration (v2)
# ============================================================
# All model info, pricing, thresholds, and behavior in one file.
# API keys are NEVER stored here — providers name an env var and
# values resolve through ai_router.secret_resolver at call time.

metadata:
  pricing_reviewed: "2026-08-04"
  review_frequency_days: 30

providers:
  anthropic:
    display_label: Anthropic
    enabled: true
    api_key_env: DABBLER_ANTHROPIC_API_KEY
    base_url: https://api.anthropic.com/v1/messages
    api_version: "2023-06-01"
    rate_limit:
      requests_per_minute: 50
      tokens_per_minute: 80000
    timeout_seconds: 600
    retry:
      max_retries: 2
      backoff_base_seconds: 2

  google:
    display_label: Google
    enabled: true
    api_key_env: DABBLER_GEMINI_API_KEY
    base_url: https://generativelanguage.googleapis.com/v1beta
    rate_limit:
      requests_per_minute: 60
      tokens_per_minute: 100000
    # 900, not 300: a tier-3 model reasoning at high effort over a large
    # evidence bundle routinely exceeds 300s, and a timeout on a mandatory
    # verification call is a correctness failure, not a comfort issue.
    timeout_seconds: 900
    retry:
      max_retries: 2
      backoff_base_seconds: 2

  openai:
    display_label: OpenAI
    enabled: true
    api_key_env: DABBLER_OPENAI_API_KEY
    base_url: https://api.openai.com/v1
    rate_limit:
      requests_per_minute: 60
      tokens_per_minute: 100000
    timeout_seconds: 900
    retry:
      max_retries: 2
      backoff_base_seconds: 2

# Transport for routine dispatch. Resolution precedence: --transport CLI
# flag > DABBLER_TRANSPORT env var > this value > default "api". This file
# is package data, so it carries the profile that works for a fresh install
# with provider API keys; a Copilot seat sets DABBLER_TRANSPORT=copilot-cli.
transport:
  profile: api

# The copilot-cli transport's own settings; inert unless that transport is
# selected. Roles are late-bound aliases resolved against the seat-local
# catalog lockfile (the lock is model-truth; this config is intent).
transports:
  copilot-cli:
    binary: copilot
    lockfile: copilot-catalog.lock   # relative to this file's directory
    billed_usage_unavailable: true    # honest non-accounting; seat spend is measured by ai_router.seat_cost
    max_invocations_per_session: 200  # per-process hard circuit breaker, not a budget
    # Dispatch ceilings; must satisfy spawn < first_byte < total. total is a
    # correctness knob: a session-verification evidence bundle is the
    # largest prompt this system sends and does not fit in 300s.
    timeouts:
      spawn_seconds: 10
      first_byte_seconds: 30
      total_seconds: 1200
    roles:
      generator:
        prefer: [claude-sonnet-4.6, gpt-5.5, gemini-3.1-pro-preview]
        require_provider_in: [anthropic, openai, google]
      verifier:
        prefer: [gpt-5.4, gemini-3.1-pro-preview, claude-sonnet-4.6]
        require_provider_in: [anthropic, openai, google]

# --- Model Registry ---
# tier: 1=cheap/fast, 2=balanced, 3=powerful/expensive.
# is_enabled: in the routed generator pool at all (identity-only entries
#   set false — they exist so orchestrator identity can resolve).
# is_enabled_as_verifier: trusted to verify other models' output.
# Rates are declared ONE way per entry: flat scalars, or a `pricing:` list
# of context-tiered / effective-dated rows (see ai_router/pricing.py).
# confirmed_on records the day a human last checked the entry's rates
# against the provider's published page; absence is the honest unchecked
# state.
models:
  gemini-flash:
    provider: google
    model_id: gemini-2.5-flash
    tier: 1
    is_enabled: true
    is_enabled_as_verifier: true
    input_cost_per_1m: 0.30
    output_cost_per_1m: 2.50
    max_context_tokens: 1048576
    max_output_tokens: 65536
    system_prompt_file: prompt-templates/system-prompts.md
    notes: "Best for simple analysis, formatting, boilerplate generation."
    generation_params:
      thinking_budget: 0
    confirmed_on: '2026-08-04'

  gemini-pro:
    provider: google
    model_id: gemini-2.5-pro
    tier: 2
    is_enabled: true
    is_enabled_as_verifier: true
    max_context_tokens: 1048576
    max_output_tokens: 65536
    system_prompt_file: prompt-templates/system-prompts.md
    notes: "Medium-complexity analysis, documentation, code review."
    generation_params:
      thinking_budget: -1
    pricing:
      - input_cost_per_1m: 1.25
        output_cost_per_1m: 10.0
        max_input_tokens: 200000
      - input_cost_per_1m: 2.5
        output_cost_per_1m: 15.0
    confirmed_on: '2026-08-04'

  gemini-3-1-pro:
    provider: google
    model_id: gemini-3.1-pro-preview
    tier: 2
    is_enabled: true
    # New model: generator + explicit-call only until calibrated.
    is_enabled_as_verifier: false
    max_context_tokens: 1048576
    max_output_tokens: 65536
    system_prompt_file: prompt-templates/system-prompts.md
    notes: "Frontier Google Pro (preview id; may change at GA)."
    generation_params:
      thinking_level: HIGH
    pricing:
      - input_cost_per_1m: 2.0
        output_cost_per_1m: 12.0
        max_input_tokens: 200000
      - input_cost_per_1m: 4.0
        output_cost_per_1m: 18.0
    confirmed_on: '2026-08-04'

  sonnet:
    provider: anthropic
    model_id: claude-sonnet-5
    tier: 2
    is_enabled: true
    is_enabled_as_verifier: true
    max_context_tokens: 200000
    max_output_tokens: 16000
    system_prompt_file: prompt-templates/system-prompts.md
    notes: "Anthropic quality without Opus cost. Introductory rate lapses 2026-09-01; the dated pricing row keeps the cost record true with no edit."
    generation_params:
      effort: medium
      thinking:
        enabled: false
        type: adaptive
    pricing:
      - input_cost_per_1m: 2.0
        output_cost_per_1m: 10.0
      - input_cost_per_1m: 3.0
        output_cost_per_1m: 15.0
        effective_from: '2026-09-01'
    confirmed_on: '2026-08-04'

  opus:
    provider: anthropic
    model_id: claude-opus-5
    tier: 3
    is_enabled: true
    is_enabled_as_verifier: true
    input_cost_per_1m: 5.00
    output_cost_per_1m: 25.00
    max_context_tokens: 200000
    max_output_tokens: 32000
    system_prompt_file: prompt-templates/system-prompts.md
    notes: "Reserved for complex architectural reasoning."
    generation_params:
      effort: high
      thinking:
        enabled: true
        type: adaptive
    confirmed_on: '2026-08-04'

  fable:
    provider: anthropic
    model_id: claude-fable-5
    # Registered and priced, not routed: at 2x Opus on both axes, enabling
    # it is an operator decision with a cost attached, not a default.
    is_enabled: false
    is_enabled_as_verifier: false
    max_context_tokens: 200000
    max_output_tokens: 32000
    system_prompt_file: prompt-templates/system-prompts.md
    notes: "Claude Fable 5. Present so a Fable-5 orchestrator can record its identity and its price is on file."
    input_cost_per_1m: 10.0
    output_cost_per_1m: 50.0
    confirmed_on: '2026-08-04'

  gpt-5-4:
    provider: openai
    model_id: gpt-5.4
    tier: 3
    is_enabled: true
    is_enabled_as_verifier: true
    input_cost_per_1m: 2.50
    output_cost_per_1m: 15.00
    max_context_tokens: 272000
    max_output_tokens: 32000
    system_prompt_file: prompt-templates/system-prompts.md
    notes: "Frontier OpenAI model; cross-provider verifier for Anthropic/Google output."
    generation_params:
      reasoning_effort: high
    confirmed_on: '2026-08-04'

  gpt-5-5:
    provider: openai
    model_id: gpt-5.5
    tier: 3
    is_enabled: true
    is_enabled_as_verifier: true
    max_context_tokens: 272000
    max_output_tokens: 32000
    system_prompt_file: prompt-templates/system-prompts.md
    notes: "Frontier OpenAI model (GPT-5.5). Cross-provider verifier + consensus engine."
    generation_params:
      reasoning_effort: high
    input_cost_per_1m: 5.0
    output_cost_per_1m: 30.0
    confirmed_on: '2026-08-04'

  gpt-5-6-sol:
    provider: openai
    model_id: gpt-5.6-sol
    tier: 3
    is_enabled: true
    # Pinned session-verification verifier: a verifier's job is to be right
    # about whether work ships — the wrong place to economise.
    is_enabled_as_verifier: true
    max_context_tokens: 272000
    max_output_tokens: 32000
    system_prompt_file: prompt-templates/system-prompts.md
    notes: "GPT-5.6 'Sol' — the most capable of the 5.6 variants."
    generation_params:
      reasoning_effort: high
    input_cost_per_1m: 5.0
    output_cost_per_1m: 30.0
    confirmed_on: '2026-08-04'

  gpt-5-6-luna:
    provider: openai
    model_id: gpt-5.6-luna
    tier: 3
    is_enabled: true
    # Not a general verifier: enabled so a discovery fan-out can prefer it
    # by name, kept out of the verifier pool so it can never win a
    # cheapest-survivor tiebreak for an adjudicating round.
    is_enabled_as_verifier: false
    max_context_tokens: 272000
    max_output_tokens: 32000
    system_prompt_file: prompt-templates/system-prompts.md
    notes: "GPT-5.6 'Luna' — one twenty-fifth of Sol's price; breadth-of-findings work only."
    generation_params:
      reasoning_effort: high
    input_cost_per_1m: 0.2
    output_cost_per_1m: 1.2
    confirmed_on: '2026-08-04'

  haiku:
    provider: anthropic
    model_id: claude-haiku-4-5-20251001
    tier: 1
    is_enabled: true
    # Enabled so a follow-through study can prefer it by name, kept out of the
    # verifier pool for the same reason as Luna: a cheap model must never win a
    # cheapest-survivor tiebreak for a round that adjudicates.
