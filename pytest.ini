[pytest]
testpaths = tests
# -n 2, never auto: auto grabs every core and starves the machine's
# other sessions. CI overrides to sequential (-n 0) — runner cores are
# few and worker startup outweighs the win.
addopts = --import-mode=importlib -n 2
markers =
    e2e: live-network end-to-end tests; excluded from the default run (run with `pytest -m e2e`).
