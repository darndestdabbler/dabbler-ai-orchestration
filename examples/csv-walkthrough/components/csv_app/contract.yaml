component: csv-app
version: 1.0.0
summary: >
  What a person at a terminal sees. Reads a path, uses the parser, reports the
  counts. Owns presentation and nothing else.

operations:
  - name: main(argv)
    summary: Reads the file named on the command line and reports on it.
    preconditions:
      - argv carries exactly one path.
    postconditions:
      - Prints the number of records read and the number of rows rejected.
      - Prints each rejection as its line number followed by the parser's
        reason, passed through unchanged. The app does not interpret, shorten
        or re-word it.
      - Exits 0 when nothing was rejected, 1 when anything was.
    retained:
      - The non-zero exit on any rejection. This is the app's answer to the
        plan's partial-failure question -- it is the caller that checks the
        rejection list rather than ignoring it, and scripts depend on it.
    errors:
      - A wrong header or bad encoding prints the parser's message and exits
        2, distinguishing "this file is not usable" from "some rows failed".
    notPromised:
      - The layout of the printed output. It is for people and it will change.
      - The wording of any rejection reason. csv-parser does not promise that
        wording, so this app cannot promise it either -- passing text through
        unchanged is a promise about this app, not about the text.
      - That exit codes beyond 0, 1 and 2 stay unused.
    tests:
      preconditions: test_requires_exactly_one_path
      postconditions:
        - test_prints_both_counts
        - test_reason_reaches_the_output_unchanged
        - test_exit_zero_only_when_nothing_rejected
      retained: test_any_rejection_exits_non_zero
      errors: test_unusable_file_exits_two
