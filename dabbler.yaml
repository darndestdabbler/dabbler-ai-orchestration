      # This file. Changing it changes what every other rule here means, so
      # it selects the tests that read the declaration rather than the tests
      # the declaration points at.
      - when: dabbler.yaml
        select:
          - tests/test_config.py
          - tests/test_affected.py
          - tests/test_runcore_checks.py
          - tests/test_packaging.py

      # --- The TypeScript router (the port) ---------------------------
      #
      # Three test files, one per thing the package states: what the
      # schemas mean, what the contract is, and what parity compares.
      # The scripts under `packages/router/scripts` are the declared
      # controls' own entry points — the controls run them, so they map
      # to no test rather than to an unknown.
      - when: packages/router/src/schema/
        select:
          - packages/router/test/schema.test.ts
      - when: packages/router/src/generated/
        select:
          - packages/router/test/schema.test.ts
          - packages/router/test/typed-payloads.test.ts
      - when: packages/router/src/contracts/
        select:
          - packages/router/test/contracts.test.ts
          - packages/router/test/typed-payloads.test.ts
      # The command's own files: the verb registry, the verbs' entry points
      # and the one seam every verb writes through. The report is what the
      # metrics test reads, so it answers for them too.
      - when: packages/router/src/cli/
        select:
          - packages/router/test/contracts.test.ts
          - packages/router/test/metrics.test.ts
      - when: packages/router/src/parity/
        select:
          - packages/router/test/parity.test.ts
      - when: packages/router/src/index.ts
        select:
          - packages/router/test/contracts.test.ts
      # The ported modules. A module's own test comes first; the others are
      # the modules that IMPORT it, because a leaf of the import graph
      # breaking shows up in its dependants and not in itself.
      - when: packages/router/src/config.ts
        select:
          - packages/router/test/config.test.ts
          - packages/router/test/metrics.test.ts
          - packages/router/test/identity.test.ts
          - packages/router/test/selection.test.ts
      - when: packages/router/src/verdict.ts
        select:
          - packages/router/test/verdict.test.ts
      - when: packages/router/src/identity.ts
        select:
          - packages/router/test/identity.test.ts
      - when: packages/router/src/metrics.ts
        select:
          - packages/router/test/metrics.test.ts
          - packages/router/test/route.test.ts
      - when: packages/router/src/lockfile.ts
        select:
          - packages/router/test/lockfile.test.ts
          - packages/router/test/metrics.test.ts
          - packages/router/test/discovery.test.ts
      - when: packages/router/src/secretResolver.ts
        select:
          - packages/router/test/secretResolver.test.ts
      - when: packages/router/src/runtimeMode.ts
        select:
          - packages/router/test/runtimeMode.test.ts
      - when: packages/router/src/journal.ts
        select:
          - packages/router/test/config.test.ts
          - packages/router/test/record.test.ts
      # The record: the ledger, the critique subtree, the sanctioned
      # writers, the lifecycle flow that reaches them, and the three
      # forward slices they are built on. One test file answers for all of
      # them, because what it proves is one thing -- the rules the record
      # is made of -- and splitting it per module would put the folds and
      # the refusals they protect in different files.
      - when: packages/router/src/ledger.ts
        select:
          - packages/router/test/record.test.ts
      - when: packages/router/src/critique.ts
        select:
          - packages/router/test/record.test.ts
      - when: packages/router/src/writers.ts
        select:
          - packages/router/test/record.test.ts
      - when: packages/router/src/session.ts
        select:
          - packages/router/test/record.test.ts
      - when: packages/router/src/progress.ts
        select:
          - packages/router/test/record.test.ts
      # The evidence protocol and the record are two readers of one module:
      # the round anchor and the digest ledger are what `record.test.ts`
      # exercises, and the transcripts, quote provenance and absence
      # searches are `evidence.test.ts`.
      - when: packages/router/src/evidence.ts
        select:
          - packages/router/test/record.test.ts
          - packages/router/test/evidence.test.ts
      - when: packages/router/src/gates.ts
        select:
          - packages/router/test/record.test.ts
      # The pre-verification stage. `checks` is the leaf -- the declaration,
      # the path grammar and the executor -- so it selects its own test and
      # the two modules that import it; `test_evidence` and `affected` are
      # one claim asked twice and share a file.
      - when: packages/router/src/checks.ts
        select:
          - packages/router/test/checks.test.ts
          - packages/router/test/preverify.test.ts
      - when: packages/router/src/testEvidence.ts
        select:
          - packages/router/test/preverify.test.ts
      - when: packages/router/src/affected.ts
        select:
          - packages/router/test/preverify.test.ts
      # Every record file is written through it, and `metrics` appends its
      # telemetry the same way.
      # Routing: the role rule both transports resolve through, the one
      # dispatch body over them, and the record of what currently exists.
      # `selection.test.ts` carries the escalation triggers as well, because
      # they live in `route.ts` and are what selection walks the ladder for.
      - when: packages/router/src/selection.ts
        select:
          - packages/router/test/selection.test.ts
          - packages/router/test/route.test.ts
      - when: packages/router/src/route.ts
        select:
          - packages/router/test/route.test.ts
          - packages/router/test/selection.test.ts
      # `session start` prints its staleness warnings, so the record's own
      # test file answers for that half.
      - when: packages/router/src/discovery.ts
        select:
          - packages/router/test/discovery.test.ts
          - packages/router/test/record.test.ts
      - when: packages/router/src/pythonJson.ts
        select:
          - packages/router/test/record.test.ts
          - packages/router/test/lockfile.test.ts
          - packages/router/test/metrics.test.ts
      - when: packages/router/src/textfile.ts
        select:
          - packages/router/test/config.test.ts
          - packages/router/test/metrics.test.ts
      - when: packages/router/src/version.ts
        select:
          - packages/router/test/lockfile.test.ts
      # Where the bundled config, the schemas and the templates are found.
      # Every module that reads one of them depends on this answer.
      - when: packages/router/src/paths.ts
        select:
          - packages/router/test/config.test.ts
          - packages/router/test/metrics.test.ts
          - packages/router/test/identity.test.ts
          - packages/router/test/schema.test.ts
      # The seat has two halves and they are read from different places. The
      # catalog, the dispatch state machine and the handoff are `transports/`;
      # what a seat SPENT is read from a store the Copilot CLI owns, so it is
      # its own module with its own file. The parity control's corpus writes
      # that store's fixture, which is why the control answers here too.
      - when: packages/router/src/seatCost.ts
        select:
          - packages/router/test/seatCost.test.ts
          - packages/router/test/parity.test.ts
      - when: packages/router/src/transports/
        select:
          - packages/router/test/transports.test.ts
          - packages/router/test/copilot.test.ts
          - packages/router/test/route.test.ts
          - packages/router/test/discovery.test.ts
          - packages/router/test/config.test.ts
          - packages/router/test/identity.test.ts
      # Not a test file: the suite's glob is `*.test.ts`, so nothing under
      # it is collected -- but every test that builds a config uses it.
      - when: packages/router/test/support/
        select:
          - packages/router/test/config.test.ts
          - packages/router/test/metrics.test.ts
          - packages/router/test/lockfile.test.ts
          - packages/router/test/transports.test.ts
          - packages/router/test/selection.test.ts
          - packages/router/test/route.test.ts
      - when: packages/router/scripts/
        select: []
      - when: packages/router/build.mjs
        select: []
      - when: packages/router/.eslintrc.json
        select: []
      # Changing how the package compiles or what it depends on changes
      # what every test in it runs under.
      - when: packages/router/tsconfig.json
        select:
          - packages/router/test/schema.test.ts
          - packages/router/test/contracts.test.ts
          - packages/router/test/typed-payloads.test.ts
          - packages/router/test/parity.test.ts
          - packages/router/test/config.test.ts
          - packages/router/test/verdict.test.ts
          - packages/router/test/identity.test.ts
          - packages/router/test/metrics.test.ts
          - packages/router/test/lockfile.test.ts
          - packages/router/test/runtimeMode.test.ts
          - packages/router/test/secretResolver.test.ts
      - when: packages/router/package.json
        select:
          - packages/router/test/schema.test.ts
          - packages/router/test/contracts.test.ts
          - packages/router/test/typed-payloads.test.ts
          - packages/router/test/parity.test.ts
          - packages/router/test/config.test.ts
          - packages/router/test/verdict.test.ts
          - packages/router/test/identity.test.ts
          - packages/router/test/metrics.test.ts
          - packages/router/test/lockfile.test.ts
          - packages/router/test/runtimeMode.test.ts
          - packages/router/test/secretResolver.test.ts
      - when: package.json
        select:
          - packages/router/test/schema.test.ts
          - packages/router/test/contracts.test.ts
          - packages/router/test/typed-payloads.test.ts
          - packages/router/test/parity.test.ts
          - packages/router/test/config.test.ts
          - packages/router/test/verdict.test.ts
          - packages/router/test/identity.test.ts
          - packages/router/test/metrics.test.ts
          - packages/router/test/lockfile.test.ts
          - packages/router/test/runtimeMode.test.ts
          - packages/router/test/secretResolver.test.ts
      - when: package-lock.json
        select:
          - packages/router/test/schema.test.ts
          - packages/router/test/contracts.test.ts
          - packages/router/test/typed-payloads.test.ts
          - packages/router/test/parity.test.ts
          - packages/router/test/config.test.ts
          - packages/router/test/verdict.test.ts
          - packages/router/test/identity.test.ts
          - packages/router/test/metrics.test.ts
          - packages/router/test/lockfile.test.ts
          - packages/router/test/runtimeMode.test.ts
          - packages/router/test/secretResolver.test.ts
      # The extension's two layers -- mocha over the vscode stub, and
      # Playwright -- are not declared suites, so no declared test answers
      # for this path and the empty list is what the selector can truly
      # say. It is not what a reader should take away: the mocha layer is
      # exactly the test that notices this source breaking, and CI runs it
      # on every push.
      #
      # Declaring it is owed, and it is D116's shape rather than a line
      # here. `targeted_command` appends the selected paths to the
      # declared command, and mocha MERGES a path list with its `spec`
      # (whether the spec comes from the command line or from
      # `.mocharc.json`) instead of being narrowed by it -- measured, both
      # forms. So the bare command cannot mean "the whole suite" and the
      # appended form mean "these tests", and the honest declaration needs
      # a runner entry point of its own. `runs_whole` would be the cheap
      # way through and it would be false: mocha does take a subset.
      - when: tools/dabbler-ai-orchestration/
        select: []
      - when: ai_router/schemas/
        select:
          # A schema is the generator's input as well as Python's
          # contract, so it selects on both sides of the port.
          - packages/router/test/schema.test.ts
          - tests/test_critique_contracts.py
          - tests/test_approved_plan.py
          - tests/test_plan_review.py
          - tests/test_step_execution.py
          - tests/test_ledger.py
          - tests/test_agency.py
          - tests/test_verify.py
          - tests/test_gates.py
          - tests/test_runcore_contracts.py
          - tests/test_packaging.py
      - when: ai_router/prompt-templates/
        select:
          - tests/test_verify.py
      - when: ai_router/copilot-catalog.lock
        select:
          - tests/test_transport_copilot.py
      - when: tests/fixtures/
        select:
          - tests/test_modules.py
      - when: docs/
        select: []
      - when: .github/
        select: []
      - when: README.md
        select: []
      - when: STATUS.md
        select: []
      - when: AGENTS.md
        select: []
      - when: CLAUDE.md
        select: []
      - when: GEMINI.md
        select: []
      - when: .gitignore
