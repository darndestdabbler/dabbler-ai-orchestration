[pytest]
testpaths = ai_router/tests
# -n auto (Set 116 S1): proven 3.6x wall-clock, identical pass/skip counts
# vs serial -- see docs/test-suite-benchmark-DENICI.txt. This is the single
# switch that makes every `python -m pytest` invocation parallel (local,
# CI, run_of_record's recorded command) without repeating the flag.
#
# --ff (failed-first): runs previously-failed tests BEFORE the rest. It
# changes only the ORDER, never the set -- the run of record still executes
# every test, so it cannot weaken test_run_fresh. When the suite is green it
# costs nothing; when a fix did not take you learn it in seconds instead of
# ~4 minutes. On a clean checkout (CI, a fresh clone) there is no cache and
# it is a no-op.
#
# DO NOT change this to --lf. `--last-failed` runs ONLY the previously
# failed tests, which would silently turn the run of record into a partial
# run and make a green close meaningless. `--lf` is for hand iteration:
#   python -m pytest --lf        # re-run just the failures, in seconds
#   python -m pytest             # then the full run of record
# That distinction is the whole reason --ff is safe here and --lf is not.
addopts = --import-mode=importlib -n auto --ff
markers =
    failure_injection: end-to-end crash/lease/concurrency recovery scenarios for the role-loops queue (run with `pytest -m failure_injection`).
    e2e: orchestrator end-to-end harness that drives start_session/close_session against tmpdir-scoped fixture session sets backed by real git repos (run with `pytest -m e2e` for the full harness; `pytest -m "not e2e"` to skip in pre-commit).
