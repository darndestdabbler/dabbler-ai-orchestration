# .github/workflows/monorepo-ci.yml — monorepo CI for module-organized
# projects (Dabbler). Scaffolded by the Dabbler AI Orchestration extension.
#
# ONE always-running job that builds and tests EVERY module, on every pull
# request and every push to `main`. That is the anti-integration-bomb rule:
# cross-module breakage surfaces on the change that causes it, not weeks later
# when the victim module next changes. Make this job the single required status
# check on `main`.
#
# HOW TO ADAPT: replace the placeholder `run:` block below with the commands
# that build and test every module in this repo. Test each module's directory
# on its own rather than running one repo-wide command, so a module shipping
# ZERO tests fails the build instead of hiding behind another module's passing
# tests. Worked example — Python, two modules (`greeter`, and `app` declaring
# `touches: [greeter]`):
# https://github.com/darndestdabbler/dabbler-ai-orchestration/blob/master/docs/tutorials/hello-world.md
#
# As scaffolded this job only succeeds, so committing it before you adapt it
# cannot break your builds. It logs a warning on every run, so the placeholder
# is visible in the job log rather than silent.
#
# LARGE REPOS: you can add path-scoped per-module jobs for faster feedback
# (dorny/paths-filter@v3, one filter per module's `codeRoots` in
# docs/modules.yaml). Keep this aggregate job as well, always-running and
# required — path filtering is an optimization, not the gate.

name: Monorepo CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test every module
