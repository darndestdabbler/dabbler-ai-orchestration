# The recorded web scenario for Set 113 Session 3.
#
# Everything above `drivers:` is PORTABLE: it says what a human does and
# what they should then see, and it is what the four generated documents
# in this directory are rendered from. Everything under `drivers:` is
# target-specific and no renderer reads it.
#
# After editing anything above `drivers:`, re-render:
#
#     .venv/Scripts/python.exe -m ai_router.scenario_render docs/walkthroughs/task-board-first-task
#
# `python -m ai_router.scenario_render --check` fails if you forget.

id: task-board-first-task
title: Put a task on the board, finish it, and filter it away

summary: >-
  A short look at what a recorded walkthrough is. You drive a
  deliberately tiny web page -- add two tasks, tick one off, then narrow
  the list -- and every step says what to do and what you should see when
  you have done it. The same five steps are what the browser recorder
  drives when it makes the video, so the video and this document can
  never describe different things.

audience: >-
  Someone working in a local clone of the `dabbler-ai-orchestration`
  repository who wants to see the walkthrough format working end to end
  on a web page, rather than read about it. **The page is a stand-in, not
  a product.** It exists so the recorder can be proved against the kind
  of target this framework is actually used to build -- .NET, Java,
  Python and plain JavaScript applications, which are all one platform
  once they reach a browser. Nothing you learn here is about the Dabbler
  extension; the point is the shape of the walkthrough, and that the
  shape works somewhere other than this repository's own product.

prerequisites:
  - >-
    A local clone of the `dabbler-ai-orchestration` repository, and
    Node.js 20 or newer. Every command below is written to be run from
    `tools/dabbler-ai-orchestration` inside that clone -- the folder that
    contains `package.json`. Open a terminal there before you start.
  - >-
    The extension package's dependencies. From
    `tools/dabbler-ai-orchestration`, run `npm install` once.

baseline:
  description: >-
    One command serves the sample page and prints its address. The page
    keeps everything in memory and writes nothing anywhere, so there is
    no state to clean up and no file to delete afterwards. Leave the
    command running while you walk the steps; press `Ctrl+C` in that
    terminal when you are finished.
  setup:
    - cwd: tools/dabbler-ai-orchestration
      command: node scripts/web-fixture-server.js
  observable: >-
    The terminal prints a line beginning `[web-fixture] http://127.0.0.1:`
    followed by a number. Open that address in a browser and you see a
    page headed `Task Board`, with a text box, an `Add task` button, three
    buttons reading `All`, `Open` and `Done`, the words `0 open`, and
    below them `No tasks yet.`

reset: >-
  Reload the page in your browser. The sample page keeps its tasks in
  memory only, so a reload empties the board and puts you back at the
  baseline. Nothing is saved and nothing needs undoing.

recovery:
  - symptom: >-
      The command stops with `Cannot find module` or
      `fixture web app not found`.
    action: >-
      You are in the wrong folder. The command runs from
      `tools/dabbler-ai-orchestration` inside your clone, not from the
      repository root.
  - symptom: The browser says the site cannot be reached.
    action: >-
      The server has stopped. Look at the terminal you started it in; if
      the command has exited, run it again and use the new address it
      prints -- the number at the end changes every time.
  - symptom: You added a task but the list still says `No tasks yet.`
    action: >-
      The text box was empty when you pressed the button. The page ignores
      a blank task on purpose. Type something into the box first.

steps:
  - id: read-the-empty-board
    title: Where you are starting from
    seconds: 6
    focus: the line of text underneath the three filter buttons
    narration: >-
      An empty board says so in two places at once -- the count and the
      list. Both change as you work, and reading them now is what makes
      the change obvious later.
    action: >-
      Look at the two lines below the `All`, `Open` and `Done` buttons.
    expect: >-
      One line reads `0 open`, and the line under it reads `No tasks yet.`

  - id: add-a-task
    title: Put something on the board
    seconds: 10
    focus: the text box and the blue `Add task` button beside it
    narration: >-
      Adding a task is the whole of the page's job. Watch the count as
      well as the list: they are the two things that have to agree.
    action: >-
      Click the text box that says `What needs doing?`, type
      `Draft the release notes`, and click the blue `Add task` button.
    expect: >-
      A row appears reading `Draft the release notes`, with an empty tick
      box to its left. The count above now reads `1 open`, and
      `No tasks yet.` is gone.

  - id: add-a-second-task
    title: Now there are two
    seconds: 9
    focus: the list of task rows
    narration: >-
      A second task is not just more of the same. One task cannot show you
      that filtering does anything, so the board needs two before the last
      step can mean anything.
    action: >-
      Type `Book the release call` into the same text box and click
      `Add task` again.
    expect: >-
      Two rows are listed, `Draft the release notes` first and
      `Book the release call` under it. The count reads `2 open`.

  - id: mark-one-done
    title: Tick one off
    seconds: 10
    checkpoint: two tasks on the board, one of them done
    focus: the tick box at the left of the first row
    narration: >-
      A finished task stays on the board rather than disappearing. That is
      deliberate: you can see what you did, and the count tells you what
      is left.
    action: >-
      Click the tick box to the left of `Draft the release notes`.
    expect: >-
      That row's text is struck through and greyed, the tick box is now
      ticked, both rows are still listed, and the count has dropped to
      `1 open`.

  - id: filter-to-open
    title: Show only what is left
    seconds: 9
    focus: the three filter buttons and the list underneath them
    narration: >-
      Filtering changes what is shown, never what is stored. Switching
      back to `All` brings the finished task straight back, which is how
      you know nothing was thrown away.
    action: Click the `Open` button.
    expect: >-
      Only `Book the release call` is listed. `Draft the release notes` is
      hidden, the `Open` button is now outlined in blue, and the count
      still reads `1 open`.

# ---------------------------------------------------------------------------
# QUARANTINE. Target-specific mechanics only. No renderer reads any of this,
# and the digest stamped into the four generated documents is taken over the
# portable half above, so editing anything below leaves all four documents
# byte-identical.
#
# `status: shipped` because, unlike the Work Explorer scenario's proposed
# block, a driver in this repo really does consume this one:
# `npm run walkthrough:web` (tools/dabbler-ai-orchestration/scripts/
# record-web-walkthrough.js). The action vocabulary below is that driver's,
# and it validates every key it reads -- this file being opaque to the
# Python model does not make it unvalidated, only validated by its own
# consumer rather than by the portable half.
#
# `emphasize` is the operator's 2026-08-15 tier-1 ruling: the driver
# outlines the element the step is about, and dims the rest, immediately
# before acting. Attention emphasis belongs to the driver, not the capture
# backend -- there is no capture-time zoom here and there is not meant to be.
# ---------------------------------------------------------------------------
drivers:
  playwright-web:
    status: shipped
    fixture: task-board
    viewport: { width: 1280, height: 800 }
    steps:
      read-the-empty-board:
        emphasize: '#summary'
        expect: { selector: '#empty-state', text: 'No tasks yet.' }
      add-a-task:
        emphasize: '#add-form'
        do:
          - fill: '#new-task'
            value: Draft the release notes
          - click: '#add-task'
        expect: { selector: '#summary', text: '1 open' }
      add-a-second-task:
        emphasize: '#add-form'
        do:
          - fill: '#new-task'
            value: Book the release call
          - click: '#add-task'
        expect: { selector: '#summary', text: '2 open' }
      mark-one-done:
        emphasize: 'li.task:first-child'
        do:
          - check: 'li.task:first-child .task-toggle'
        expect: { selector: '#summary', text: '1 open' }
      filter-to-open:
        emphasize: '#filters'
        do:
          - click: '#filter-open'
        expect: { selector: '#task-list', text: 'Book the release call' }
