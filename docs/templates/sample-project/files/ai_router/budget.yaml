# Project verification budget — shipped with the Dabbler sample project.
#
# The sample is a deliberately zero-cost, single-agent, local-only
# walkthrough: no second AI reviews the work, so the session closes with
# `verification_method: "skipped"` in its disposition. That is an
# OPERATOR-declared exception, and the close-out gate requires it to be
# declared here on disk rather than asserted by the agent — which is
# exactly what this file does. Without it, `close_session` refuses the
# sample's honest no-verification close.
#
# Set 112 removed the Lightweight tier. Before that, `tier: lightweight`
# in the sample's spec made the verification-integrity gate inert; this
# zero-budget declaration is the one-tier replacement, and it is the
# sanctioned mechanism (docs/budget-yaml-schema.md), not a bypass.
threshold_usd: 0
scope: per-project
mode: "zero-budget"
verification_method: "skipped"
verification_nte_usd: 0
set_by: "sample-project-bundle"
warn_at_percent: 80
