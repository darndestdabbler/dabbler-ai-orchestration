name: Get Marketplace identity ID

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  get-identity:
    name: Get managed identity Marketplace ID
    runs-on: ubuntu-latest
    environment: marketplace

    steps:
      - name: Sign in to Azure using GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Retrieve Marketplace resource ID
        shell: bash
        run: |
          response="$(
            az rest \
              --method GET \
              --url "https://app.vssps.visualstudio.com/_apis/profile/profiles/me?api-version=7.1" \
              --resource "499b84ac-1321-427f-aa17-267ca6975798"
          )"

          resource_id="$(jq -r '.id // empty' <<< "$response")"

          if [[ -z "$resource_id" ]]; then
            echo "::error::No Marketplace resource ID was returned."
            echo "$response"
            exit 1
          fi

          echo "### Marketplace managed identity resource ID" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "\`$resource_id\`" >> "$GITHUB_STEP_SUMMARY"
