    output_cost_per_1m: 5.0
    confirmed_on: '2026-08-25'

  gpt-5-4-mini:
    provider: openai
    model_id: gpt-5.4-mini
    tier: 2
    is_enabled: true
    is_enabled_as_verifier: true
    input_cost_per_1m: 0.75
    output_cost_per_1m: 4.50
    max_context_tokens: 400000
    max_output_tokens: 16000
    system_prompt_file: prompt-templates/system-prompts.md
    notes: "Small OpenAI model; cross-provider verifier for Gemini output."
    generation_params:
      reasoning_effort: medium
    confirmed_on: '2026-08-04'

  # --- Identity-registry-only entries ---
  # Orchestrator models outside the routed pool that must still resolve in
  # the registry so identity resolution and the verifier exclusion can
  # derive their effective provider. is_enabled: false keeps them out of
  # every selection path, and they deliberately carry no rates — a model's
  # price lives in this file exactly once, on its routed entry.
  gemini-3-pro:
    provider: google
    model_id: gemini-3-pro-preview
    is_enabled: false
    is_enabled_as_verifier: false
    notes: "Identity registry only: Gemini Code Assist orchestrator sessions."

routing:
  tier1_max_complexity: 30    # score <= 30 -> tier 1
  tier2_max_complexity: 65    # 31-65 -> tier 2
  default_tier: 2
  tier_assignments:
    1: gemini-flash
    2: gemini-pro
    3: opus
  # Preferences, never exclusion overrides: a pin whose provider is
  # excluded falls through to the cheapest surviving candidate.
  task_type_overrides:
    code-review: sonnet
    architecture: opus
    session-verification: gpt-5-6-sol
    session-close-out: sonnet

task_type_params:
  formatting:
    sonnet: {effort: low, thinking: {enabled: false}}
    opus: {effort: low, thinking: {enabled: false}}
    gemini-flash: {thinking_budget: 0}
    gemini-pro: {thinking_budget: 128}   # Pro rejects 0 ("only works in thinking mode"); 128 is its minimum
    gpt-5-4-mini: {reasoning_effort: none}
    gpt-5-4: {reasoning_effort: none}
  summarization:
    sonnet: {effort: low, thinking: {enabled: false}}
    opus: {effort: low, thinking: {enabled: false}}
    gemini-flash: {thinking_budget: 0}
    gemini-pro: {thinking_budget: 128}   # Pro rejects 0 ("only works in thinking mode"); 128 is its minimum
    gpt-5-4-mini: {reasoning_effort: none}
    gpt-5-4: {reasoning_effort: low}
  documentation:
    sonnet: {effort: low, thinking: {enabled: false}}
    gemini-pro: {thinking_budget: -1}
    gpt-5-4-mini: {reasoning_effort: low}
  session-close-out:
    sonnet: {effort: low, thinking: {enabled: false}}
    gemini-pro: {thinking_budget: 128}   # Pro rejects 0 ("only works in thinking mode"); 128 is its minimum
    gpt-5-4-mini: {reasoning_effort: none}
  test-generation:
    sonnet: {effort: medium, thinking: {enabled: true, type: adaptive}}
    gemini-pro: {thinking_budget: -1}
    gpt-5-4-mini: {reasoning_effort: medium}
  code-review:
    sonnet: {effort: medium, thinking: {enabled: true, type: adaptive}}
    gemini-pro: {thinking_budget: -1}
    gpt-5-4-mini: {reasoning_effort: medium}
  analysis:
    sonnet: {effort: medium, thinking: {enabled: true, type: adaptive}}
    gemini-pro: {thinking_budget: -1}
    gpt-5-4-mini: {reasoning_effort: medium}
  refactoring:
    sonnet: {effort: medium, thinking: {enabled: true, type: adaptive}}
    gemini-pro: {thinking_budget: -1}
    gpt-5-4-mini: {reasoning_effort: medium}
  session-verification:
    sonnet: {effort: high, thinking: {enabled: true, type: adaptive}}
    opus: {effort: high, thinking: {enabled: true, type: adaptive}}
    gemini-pro: {thinking_budget: -1}
    gpt-5-4: {reasoning_effort: high}
    gpt-5-4-mini: {reasoning_effort: high}
  security-review:
    sonnet: {effort: high, thinking: {enabled: true, type: adaptive}}
    opus: {effort: high, thinking: {enabled: true, type: adaptive}}
    gemini-pro: {thinking_budget: -1}
    gpt-5-4: {reasoning_effort: high}
  architecture:
    opus: {effort: max, thinking: {enabled: true, type: adaptive}}
    gemini-pro: {thinking_budget: -1}
    gpt-5-4: {reasoning_effort: xhigh}
  planning:
    opus: {effort: high, thinking: {enabled: true, type: adaptive}}
    gemini-pro: {thinking_budget: -1}
    gpt-5-4: {reasoning_effort: high}
  verification:
    sonnet: {effort: medium, thinking: {enabled: true, type: adaptive}}
    opus: {effort: high, thinking: {enabled: true, type: adaptive}}
    gemini-pro: {thinking_budget: -1}
    gpt-5-4: {reasoning_effort: high}
    gpt-5-4-mini: {reasoning_effort: medium}

# Deliberate non-goal: do not invest further engineering in tightening this
# heuristic. The heuristic + escalation safety net is the intended stopping
# point; if the score misjudges a task, escalation catches it and the
# metrics log shows the pattern.
complexity:
  weights:
    context_length: 0.30
    keyword_signals: 0.35
    task_type: 0.20
    explicit_hint: 0.15
  context_length_scores:
    - {max_chars: 500, score: 10}
    - {max_chars: 2000, score: 25}
    - {max_chars: 5000, score: 45}
    - {max_chars: 10000, score: 65}
    - {max_chars: 999999, score: 85}
  task_type_scores:
    code-review: 40
    documentation: 25
    analysis: 55
    test-generation: 35
    planning: 70
    formatting: 10
    summarization: 20
    architecture: 80
    security-review: 75
    refactoring: 65
    session-verification: 70
    session-close-out: 15
    general: 50
  high_complexity_keywords:
    - architect
    - security
    - performance
    - concurrency
    - migration
    - breaking change
    - cross-cutting
    - distributed
    - race condition
    - backward compatible
    - critical
    - complex
    - authentication
    - authorization
    - permission
    - injection
    - XSS
    - CSRF
    - token
    - encryption
  low_complexity_keywords:
    - rename
    - typo
    - format
    - lint
    - boilerplate
    - simple
    - straightforward
    - placeholder
    - stub
    - comment
    - log
    - copy

escalation:
  enabled: true
  max_escalations: 2          # tier 1 -> 2 -> 3, then give up
  triggers:
    empty_response: true
    max_tokens_hit: true
    min_output_tokens: 30
    refusal_detection: true
  refusal_phrases:
    - "i can't help with"
    - "i'm unable to"
    - "i cannot assist"
    - "beyond my capabilities"
    - "i don't have enough context"

# Cross-provider verification. Session 2 wires the loop; the settings here
# are read by the verifier selection and prompt template resolution.
verification:
  enabled: true
  # Verifier selection is rule-based: different provider than the
  # generator, is_enabled, is_enabled_as_verifier, same tier or one higher;
  # cheapest worst-case output rate wins. preferred_pairings is an optional
  # tiebreaker layer consulted only when the pairing survives the rules.
  preferred_pairings:
    sonnet: gemini-pro
    gemini-flash: gpt-5-4-mini
    gemini-pro: gpt-5-4-mini
    opus: gpt-5-4
    gpt-5-4-mini: sonnet
    gpt-5-4: opus
  auto_verify_task_types:
    - code-review
    - security-review
    - architecture
    - documentation
  settings:
    # The session-verification loop suspends at this bound. The closed
    # severity vocabulary is the primary control; the cap is the backstop.
    max_rounds: 3
    on_disagreement: merge     # merge | flag | re-route
    on_disagreement_by_task_type:
      code-review: merge
      security-review: merge
      test-generation: merge
      documentation: merge
      analysis: flag
      planning: flag
      architecture: flag
      refactoring: flag
    tiebreaker_model: opus
    max_cost_multiplier: 3.0
    prompt_template_file: prompt-templates/verification.md

metrics:
  enabled: true
  log_filename: router-metrics.jsonl

# Which tests a change makes necessary, and what proves the suite was green.
#
# Pre-verification runs the selected tests only. The full suite is recorded
# once, against the final verified tree -- never as ordinary pre-verification
# evidence.
testing:
  suites:
    - name: python
      command: python -m pytest
      expensive: true
      covers:
        - ai_router/
        - tests/
        - pyproject.toml
        - pytest.ini

  # Deterministic controls are declared here — one entry per kind, from
  # compile, typecheck, lint, analyzer. A declared control runs before
  # verification and its exit code is the fact; `required` sends a red
  # result back to the author instead of buying a verifier's opinion on
  # something the exit code already settled. This repository declares none:
  # it ships no typechecker, linter, or analyzer, and the record says
  # `not_applicable` rather than inventing a green row for a tool nobody
  # runs.

  selection:
    # Where the tests live and what this repository calls them. Declared,
    # because a framework that guesses either one has guessed an ecosystem.
    test_roots:
      - tests
    test_glob: "test_*.py"

    # Changing one of these changes what every test does, so the selector can
    # prove the whole suite is affected instead of an operator asserting it.
    repo_wide:
      - tests/conftest.py
      - pytest.ini
      - pyproject.toml

    # Run when a changed path maps to nothing. Cheap, broad, and enough to
    # notice a structural break -- not a substitute for a real mapping.
    smoke:
      - tests/test_config.py

    # Which tests answer for which path. Every mapping is declared here:
    # nothing is inferred from imports, because inferring it costs a parser
    # per language and buys an economy, not a proof. The proof is the
    # complete suite against the final verified tree, so a rule that has gone
    # stale costs a late discovery there and cannot ship a defect.
    #
    # A rule names the tests that would notice this path breaking -- the ones
    # that drive it, directly or through one thin caller. An empty `select`
    # declares "this path affects no test", which is a mapping, not an
    # unknown. A path no rule covers records `selection_unknown`, runs the
    # smoke tests, and raises a risk; that is the loud state, and it is the
    # signal that a rule is missing.
    rules:
      - when: ai_router/__init__.py
        select:
          - tests/test_route.py
      - when: ai_router/affected.py
        select:
          - tests/test_affected.py
          - tests/test_verify.py
          - tests/test_step_execution.py
      - when: ai_router/approved_plan.py
        select:
          - tests/test_approved_plan.py
          - tests/test_session.py
          - tests/test_step_execution.py
      - when: ai_router/bootstrap.py
        select:
          - tests/test_bootstrap.py
          - tests/test_step_execution.py
      - when: ai_router/checks.py
        select:
          - tests/test_runcore_checks.py
          - tests/test_runcore_verified.py
          - tests/test_runcore_fast.py
      - when: ai_router/config.py
        select:
          - tests/test_config.py
          - tests/test_critique_contracts.py
          - tests/test_route.py
          - tests/test_verify.py
      - when: ai_router/evidence.py
        select:
          - tests/test_evidence_protocol.py
          - tests/test_affected.py
          - tests/test_critique_contracts.py
          - tests/test_gates.py
          - tests/test_session.py
          - tests/test_verify.py
      - when: ai_router/facts.py
        select:
          - tests/test_facts.py
          - tests/test_verify.py
          - tests/test_step_execution.py
      - when: ai_router/gates.py
        select:
          - tests/test_gates.py
          - tests/test_session.py
          - tests/test_verify.py
      - when: ai_router/identity.py
        select:
          - tests/test_identity.py
          - tests/test_session.py
          - tests/test_verify.py
      - when: ai_router/ledger.py
        select:
          - tests/test_ledger.py
          - tests/test_affected.py
          - tests/test_critique_contracts.py
          - tests/test_gates.py
          - tests/test_session.py
          - tests/test_verify.py
          - tests/test_step_execution.py
      - when: ai_router/metrics.py
        select:
          - tests/test_metrics.py
          - tests/test_route.py
          - tests/test_verify.py
      - when: ai_router/modules.py
        select:
          - tests/test_modules.py
      - when: ai_router/plan_review.py
        select:
          - tests/test_plan_review.py
          - tests/test_step_execution.py
      - when: ai_router/pricing.py
        select:
          - tests/test_pricing.py
          - tests/test_selection.py
          - tests/test_metrics.py
          - tests/test_route.py
      - when: ai_router/progress.py
        select:
          - tests/test_progress.py
          - tests/test_session.py
          - tests/test_gates.py
          - tests/test_verify.py
      - when: ai_router/route.py
        select:
          - tests/test_route.py
          - tests/test_escalation.py
          - tests/test_verify.py
      - when: ai_router/runcli.py
        select:
          - tests/test_runcore_fast.py
          - tests/test_runcore_verified.py
          - tests/test_runcore_checks.py
          - tests/test_runcore_recovery.py
          - tests/test_runcore_contracts.py
          - tests/test_runcore_independence.py
      - when: ai_router/runcore.py
        select:
          - tests/test_runcore_contracts.py
          - tests/test_runcore_fast.py
          - tests/test_runcore_verified.py
          - tests/test_runcore_recovery.py
          - tests/test_runcore_independence.py
      - when: ai_router/runtime_mode.py
        select:
