# The exemplary scenario for the Set 113 walkthrough model.
#
# Everything above `drivers:` is PORTABLE: it says what a human does and
# what they should then see, and it is what the four generated documents
# in this directory are rendered from. Everything under `drivers:` is
# target-specific and no renderer reads it.
#
# After editing anything above `drivers:`, re-render:
#
#     .venv/Scripts/python.exe -m ai_router.scenario_render docs/walkthroughs/work-explorer-first-look
#
# `python -m ai_router.scenario_render --check` fails if you forget.

id: work-explorer-first-look
title: Read where every session set stands, in one look

summary: >-
  The AI Work Explorer answers one question without you opening a file:
  what is being worked on, what is waiting, and what is finished. This
  walks a throwaway sample project that has one of each, and reads all
  three off the tree.

audience: >-
  Someone working in a local clone of the `dabbler-ai-orchestration`
  repository -- a contributor, or a maintainer of a project that uses the
  framework -- who wants to know what the AI Work Explorer panel is telling
  them. No prior knowledge of the framework itself is assumed. It is **not**
  a walkthrough of your own project: it drives a throwaway sample project
  the repository ships for exactly this purpose, so what you see is the
  same on every machine.

prerequisites:
  - >-
    A local clone of the `dabbler-ai-orchestration` repository. Every command
    below is written to be run from the **root of that clone** -- the folder
    that contains `ai_router/` and `tools/`. Open a terminal there before you
    start. If you have no clone, this walkthrough is not the place to begin;
    the repository's own README covers getting one.
  - >-
    Node.js 20 or newer. From the repository root, run `cd
    tools/dabbler-ai-orchestration && npm install` once, then `cd` back to the
    root.
  - >-
    A VS Code the launcher can find. From the repository root, running `cd
    tools/dabbler-ai-orchestration && npm run test:playwright` once downloads
    one into `tools/dabbler-ai-orchestration/.vscode-test/`; otherwise set the
    `VSCODE_BIN` environment variable to the full path of a VS Code executable
    you already have.

baseline:
  description: >-
    One command does all the staging. It copies a small sample project into
    a throwaway folder outside the repository, launches a second VS Code
    window against that copy, and opens the AI Work Explorer for you. The
    sample project is disposable -- nothing you do in it touches your own
    work, and re-running the command gives you a clean one. Run these two
    lines from the **root of your clone**; the first changes into the
    extension package, and the second is what starts everything.
  setup:
    - cwd: tools/dabbler-ai-orchestration
      command: npm run walk
  observable: >-
    A second VS Code window is open, its title bar says `Dabbler UAT fixture
    workspace`, and the AI Work Explorer panel is showing in the sidebar
    with at least one row in it.

reset: >-
  Close the second VS Code window and run `npm run walk` again. It stages a
  brand-new copy of the sample project every time, so there is no state to
  clean up and nothing to undo.

recovery:
  - symptom: >-
      The command stops with `npm error Missing script: "walk"`.
    action: >-
      You are in the wrong folder. The command runs from
      `tools/dabbler-ai-orchestration` inside your clone, not from the
      repository root and not from anywhere else.
  - symptom: The command stops with `No VS Code binary found`.
    action: >-
      Run `npm run test:playwright` once from `tools/dabbler-ai-orchestration`
      to download a VS Code, or set the `VSCODE_BIN` environment variable to
      the full path of a VS Code executable you already have. Then run
      `npm run walk` again.
  - symptom: The second window opened but you cannot see the AI Work Explorer.
    action: >-
      Click the AI Work Explorer icon in the Activity Bar down the far left
      edge of that window to show the panel.
  - symptom: The panel is showing but has no rows in it.
    action: >-
      Open the Command Palette with `Ctrl+Shift+P` and run
      `Dabbler: Refresh Work Explorer`.

steps:
  - id: read-the-module-row
    title: The one row you start from
    seconds: 8
    focus: the single top row of the AI Work Explorer panel
    narration: >-
      Everything the Explorer shows hangs off a module. This sample project
      declares none, so all of its work sits under the one the Explorer
      supplies by default.
    action: >-
      Look at the top row of the AI Work Explorer panel in the second
      window.
    expect: >-
      A single row reading `Default`, with `4 sets` in smaller grey text
      just after the name.

  - id: open-the-status-buckets
    title: Split the work by where it stands
    seconds: 8
    checkpoint: buckets showing
    focus: the three rows that appear underneath `Default`
    narration: >-
      Underneath a module, work is grouped by where it stands rather than by
      when it was created. The three groups always render, even when one of
      them is empty, so a group you expected and cannot find is a real
      answer rather than a missing row.
    action: Click the arrow to the left of the word `Default`.
    expect: >-
      Three rows appear underneath it, in this order: `In Progress` with
      `1 set` after it, `Not Started` with `2 sets`, and `Complete` with
      `1 set`.

  - id: find-what-is-being-worked-on
    title: What is being worked on right now
    seconds: 10
    focus: the hover card over the set row under `In Progress`
    narration: >-
      The row itself carries only the name. How far along it is lives in the
      hover card, which keeps the row readable at any panel width.
    action: >-
      Click the arrow to the left of `In Progress`, then rest the pointer on
      the row that appears underneath it.
    expect: >-
      One row named `001-hello-page`, and a hover card that reads
      `in progress` followed by `1/3 sessions complete`.

  - id: find-out-why-something-is-waiting
    title: Why something has not started
    seconds: 10
    focus: the hover card over `002-style-the-greeting`
    narration: >-
      Not started is not the same as available to start. A set can be
      waiting on another one, and the hover card names which, so nobody has
      to open a file to find out.
    action: >-
      Click the arrow to the left of `Not Started`, then rest the pointer on
      the row named `002-style-the-greeting`.
    expect: >-
      A hover card saying the set is blocked by prerequisites, naming
      `001-hello-page` and its current state, `in progress`.

  - id: open-the-spec-from-the-row
    title: Go straight to the plan
    seconds: 10
    focus: the editor area to the right of the panel
    narration: >-
      Every row is a way in. Clicking the name rather than the arrow opens
      that set's specification -- the document describing what the work is
      -- and, for anything not yet finished, puts the sentence that starts
      its next session on your clipboard so you can paste it straight into
      a chat.
    action: >-
      Click the words `001-hello-page` themselves -- the name, not the arrow
      beside it.
    expect: >-
      That set's `spec.md` opens in the editor area beside the panel, and a
      notification appears in the bottom right reading
      `Copied: Start the next session of 001-hello-page`.

# ---------------------------------------------------------------------------
# QUARANTINE. Target-specific mechanics only. No renderer reads any of this,
# and the digest stamped into the four generated documents is taken over the
# portable half above, so editing anything below leaves all four documents
# byte-identical.
#
# Set 113 Session 2 authored the seam, not a driver. The selectors below are
# the ones the shipped Layer 3 Playwright suite already drives this tree
# with (`src/test/playwright/electronLaunch.ts`). Session 4 built the driver
# that consumes this block -- `scripts/record-vscode-walkthrough.js` -- so
# `status` now says `implemented` rather than `proposed`.
#
# The `expect` clauses are quarantined too, and they are deliberately WEAKER
# than the portable `expect:` prose above. A row being visible is what a
# driver can check; "a hover card that reads `in progress` followed by
# `1/3 sessions complete`" is what a READER checks, and pretending the
# driver had verified it would be the machine claiming credit for the
# human's half of the walkthrough.
# ---------------------------------------------------------------------------
drivers:
  playwright-vscode:
    status: implemented
    launcher: tools/dabbler-ai-orchestration/scripts/vscode-launch.js
    recorder: tools/dabbler-ai-orchestration/scripts/record-vscode-walkthrough.js
    paneSelector: '.monaco-list-row'
    twistieSelector: '.monaco-tl-twistie'
    steps:
      read-the-module-row:
        rowText: Default
        expect: { rowText: Default }
      open-the-status-buckets:
        rowText: Default
        click: twistie
        expect: { rowText: In Progress }
      find-what-is-being-worked-on:
        rowText: In Progress
        click: twistie
        then: { rowText: 001-hello-page, hover: true }
        expect: { rowText: 001-hello-page }
      find-out-why-something-is-waiting:
        rowText: Not Started
        click: twistie
        then: { rowText: 002-style-the-greeting, hover: true }
        expect: { rowText: 002-style-the-greeting }
      open-the-spec-from-the-row:
        rowText: 001-hello-page
        click: body
