          - tests/test_verify.py
      - when: ai_router/seat_cost.py
        select:
          - tests/test_seat_cost.py
      - when: ai_router/secret_resolver.py
        select:
          - tests/test_selection.py
          - tests/test_route.py
          - tests/test_transport_api.py
      - when: ai_router/selection.py
        select:
          - tests/test_selection.py
          - tests/test_route.py
          - tests/test_escalation.py
      - when: ai_router/session.py
        select:
          - tests/test_session.py
          - tests/test_affected.py
          - tests/test_bootstrap.py
          - tests/test_critique_contracts.py
          - tests/test_gates.py
          - tests/test_verify.py
      - when: ai_router/stepreview.py
        select:
